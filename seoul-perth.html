<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Comment Generator · Perth x Seoul Society Clinic</title>
<style>
  :root {
    --bg: #f7f4f2;
    --paper: #fffefc;
    --ink: #2a2523;
    --muted: #7a726e;
    --line: #e8e0db;
    --clinic: #b08d8d;
    --clinic-dark: #8f6f6f;
    --gold: #c4b5a0;
    --chip: #f3eeea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 18px 56px; }
  h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
  .sub { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
  .notice {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--chip);
    border-left: 3px solid var(--gold);
    color: #4a4442;
    font-size: 14px;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin: 22px 0 16px;
    font-size: 15px;
  }
  .count { font-weight: 600; }
  .pool { color: var(--muted); }
  .preview {
    min-height: 220px;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 16px;
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 15px;
  }
  .preview.empty { color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  button {
    appearance: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    padding: 6px 10px;
    min-height: 32px;
  }
  .primary { background: var(--clinic); color: #fff; }
  .primary:hover { background: var(--clinic-dark); }
  .secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  .secondary:hover { background: #f0ebe7; }
  .secondary:disabled { opacity: 0.45; cursor: not-allowed; }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    border: 0;
    background: transparent;
    color: var(--ink);
    padding: 0;
    min-height: 32px;
    cursor: pointer;
  }
  .switch {
    width: 36px;
    height: 20px;
    border-radius: 999px;
    background: #d5ccc6;
    position: relative;
    flex: 0 0 auto;
    transition: background 0.2s ease;
  }
  .switch i {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s ease;
  }
  .toggle.on .switch { background: var(--clinic); }
  .toggle.on .switch i { transform: translateX(16px); }
  .toggle span { font-size: 13px; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: #fff;
    padding: 10px 14px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>X Comment Generator</h1>
      <p class="sub">Perth · Seoul Society Clinic · Central Si Racha</p>
      <div class="notice">Press Generate &amp; Copy to get comment. Trend starts 16:45 BKK (4:45 PM). Do not use keyword or hashtag before then.</div>
    </header>
    <div class="stats">
      <div class="count" id="count">Copied: 0 comments</div>
      <div class="pool" id="pool"></div>
    </div>
    <div class="preview empty" id="preview">Your comment will appear here.</div>
    <div class="actions">
      <button class="primary" id="generate" type="button">Generate &amp; Copy</button>
      <button class="secondary" id="post" type="button" disabled>Post X</button>
      <button class="toggle" id="extra" type="button" aria-pressed="false">
        <span class="switch"><i></i></span>
        <span id="extraLabel">Off: keyword + main hashtag</span>
      </button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
const LIMIT = 280;

const openings = [
  "Central Si Racha lights up the second Perth steps onto the G Floor.",
  "Perth walks into Seoul Society Clinic and the whole activity area erupts.",
  "The G Floor at Central Si Racha already feels brighter with Perth here.",
  "Perth arrives at Seoul Society and every camera turns at once.",
  "Fans spot that smile before anything else at Si Racha tonight.",
  "Seoul Society Clinic just got the warmest special guest possible.",
  "Perth on the G Floor and the energy jumps immediately.",
  "The activity area fills with cheers the moment Perth appears.",
  "Perth moves across the Seoul Society booth like he owns the night.",
  "Si Racha fans already know this hour belongs to Perth.",
  "Live streams lock onto Perth the second he steps in frame.",
  "Perth’s presence turns a clinic event into pure excitement.",
  "The G Floor goes quiet then explodes when Perth walks in.",
  "Perth tilts his head and the whole section screams.",
  "Seoul Society + Perth at Central Si Racha is exactly what fans needed.",
  "That outfit hits different under the mall lights tonight.",
  "Perth looks so soft yet so sharp standing with Seoul Society.",
  "Every angle at Si Racha finds Perth first.",
  "The special guest walks into Seoul Society and steals the show.",
  "Perth makes the entire G Floor feel alive in seconds."
];

const middles = [
  "That outfit is clean, soft, and perfectly on brand for tonight.",
  "The fit sits so well under the clinic lights — pure visual win.",
  "He looks comfortable, glowing, and completely in his element.",
  "Seoul Society’s setup frames him perfectly without overpowering the moment.",
  "The smile, the posture, the whole look just hits different.",
  "Fans catch every soft gesture and the energy stays nonstop.",
  "He waves, laughs, and the whole activity area stays locked on him.",
  "Clinic lights + Perth’s presence = instant soft glow.",
  "Nothing feels forced — he just lights up the booth naturally.",
  "The outfit details catch every flash and still look effortless.",
  "He keeps moving lightly while the crowd stays glued to him.",
  "Seoul Society Clinic gets a full dose of pure Perth charm.",
  "That gentle expression mixed with the sharp fit is deadly.",
  "Cameras keep finding him even when he steps slightly back.",
  "He matches the event energy then lifts it even higher.",
  "The whole G Floor feels warmer the longer he stays.",
  "Every clip already looks like a favorite moment.",
  "He stays playful and soft while the hype never drops.",
  "Outfit, smile, and presence all in perfect sync tonight.",
  "Seoul Society chose well — Perth makes the whole stop feel special.",
  "His presentation style is so natural and charming, fans can’t look away.",
  "The way he interacts with everyone is pure Perth — warm and effortless.",
  "He speaks so smoothly and the whole crowd hangs on every word.",
  "That soft yet confident stage presence is classic Perth.",
  "Even the way he stands and gestures feels elegant tonight."
];

const closers = [
  "Tonight Perth shines at Seoul Society.",
  "Si Racha gets the softest, brightest hour possible.",
  "He leaves the same way he arrived: full of warmth.",
  "Seoul Society Clinic now has one clear Perth moment.",
  "Fans leave with the same soft smile he gave them.",
  "The evening already feels complete with him there.",
  "Perth turns a clinic event into pure memory.",
  "Proud of our boy every single time he shows up.",
  "Another beautiful stage for Perth tonight.",
  "Live viewers get exactly the soft energy they came for.",
  "He makes the G Floor unforgettable.",
  "The energy stays high long after he moves on.",
  "Perth owns the night without even trying hard.",
  "Fans already replaying every soft second.",
  "This is the Si Racha night everyone will remember.",
  "Counting down every second until he appears again.",
  "Seoul Society + Perth = pure soft win.",
  "He keeps the spark. The clinic keeps the lights.",
  "Another night where Perth just quietly steals everything.",
  "Can’t wait to see more of this glowing version of him."
];

function getSuffix(extra) {
  const tags = extra
    ? "#SeoulSocietyClinicxPerth\n#PerthTanapon"
    : "#SeoulSocietyClinicxPerth";
  return "\n\nPERTH SEOUL AT SI RACHA\n\n" + tags;
}

const pool = [];
const suffixOff = getSuffix(false);
const suffixOn = getSuffix(true);

openings.forEach(o => {
  middles.forEach(m => {
    closers.forEach(c => {
      const body = o + " " + m + " " + c;
      const fullOff = body + suffixOff;
      const fullOn = body + suffixOn;
      if (fullOff.length <= LIMIT || fullOn.length <= LIMIT) {
        pool.push(body);
      }
    });
  });
});

let order = pool.map((_, i) => i);
let cursor = 0;
let copied = 0;
let current = "";
let lastBody = "";
let extraOn = false;

const countEl = document.getElementById("count");
const poolEl = document.getElementById("pool");
const preview = document.getElementById("preview");
const postBtn = document.getElementById("post");
const toast = document.getElementById("toast");
const extraBtn = document.getElementById("extra");
const extraLabel = document.getElementById("extraLabel");

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
}
shuffle(order);

function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 1400);
}

function suffix() {
  return getSuffix(extraOn);
}

function build(body) {
  return body + suffix();
}

function refreshExtra() {
  extraBtn.classList.toggle("on", extraOn);
  extraBtn.setAttribute("aria-pressed", extraOn ? "true" : "false");
  extraLabel.textContent = extraOn
    ? "On: + #PerthTanapon"
    : "Off: keyword + main hashtag";
  if (!lastBody) return;
  current = build(lastBody);
  if (current.length > LIMIT) {
    lastBody = "";
    current = "";
    preview.textContent = "Your comment will appear here.";
    preview.classList.add("empty");
    postBtn.disabled = true;
    return;
  }
  preview.textContent = current;
  preview.classList.remove("empty");
}

async function generate() {
  const tail = suffix();
  const room = LIMIT - tail.length;
  let body = "";
  for (let n = 0; n < pool.length; n++) {
    if (cursor >= order.length) {
      shuffle(order);
      cursor = 0;
    }
    const next = pool[order[cursor++]];
    if (next.length <= room) {
      body = next;
      break;
    }
  }
  if (!body) {
    showToast("No comment fits.");
    return;
  }
  lastBody = body;
  current = build(body);
  preview.textContent = current;
  preview.classList.remove("empty");
  postBtn.disabled = false;
  try {
    await navigator.clipboard.writeText(current);
    copied += 1;
    countEl.textContent = "Copied: " + copied + " comments";
    showToast("Copied");
  } catch (err) {
    showToast("Copy failed. Select the text manually.");
  }
}

poolEl.textContent = "Pool: " + pool.length + " comments (≤280)";
document.getElementById("generate").addEventListener("click", generate);
extraBtn.addEventListener("click", () => {
  extraOn = !extraOn;
  refreshExtra();
});
postBtn.addEventListener("click", () => {
  if (!current || current.length > LIMIT) return;
  window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(current), "_blank", "noopener");
});
document.addEventListener("keydown", (event) => {
  if (event.code !== "Space") return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON") return;
  event.preventDefault();
  generate();
});
</script>
</body>
</html>
