<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Comment Generator · Perth as Kongthai | ScarletHeartTHLIVE</title>
<style>
  :root {
    --bg: #1a0f14;
    --paper: #2a1a22;
    --ink: #f5e6ea;
    --muted: #b89aa5;
    --line: #4a2f3a;
    --clinic: #c23a5a;
    --clinic-dark: #a02e48;
    --gold: #d4a5b0;
    --chip: #3d2530;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 18px 56px; }
  h1 { margin: 0 0 8px; font-size: 26px; font-weight: 600; letter-spacing: -0.03em; }
  .sub { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
  .notice {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--chip);
    border-left: 3px solid var(--gold);
    color: #e8cfd6;
    font-size: 14px;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin: 22px 0 16px;
    font-size: 15px;
  }
  .count { font-weight: 600; }
  .pool { color: var(--muted); }
  .preview {
    min-height: 220px;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 16px;
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 15px;
  }
  .preview.empty { color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  button {
    appearance: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    padding: 6px 10px;
    min-height: 32px;
  }
  .primary { background: var(--clinic); color: #fff; flex: 0 0 auto; }
  .primary:hover { background: var(--clinic-dark); }
  .secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
    flex: 0 0 auto;
  }
  .secondary:hover { background: #3d2530; }
  .secondary:disabled { opacity: 0.45; cursor: not-allowed; }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    border: 0;
    background: transparent;
    color: var(--ink);
    padding: 0;
    min-height: 32px;
    cursor: pointer;
  }
  .switch {
    width: 36px;
    height: 20px;
    border-radius: 999px;
    background: #5a3a45;
    position: relative;
    flex: 0 0 auto;
    transition: background 0.2s ease;
  }
  .switch i {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s ease;
  }
  .toggle.on .switch { background: var(--clinic); }
  .toggle.on .switch i { transform: translateX(16px); }
  .toggle span { font-size: 13px; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: #1a0f14;
    padding: 10px 14px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>X Comment Generator</h1>
      <p class="sub">Perth as Kongthai · Scarlet Heart TH LIVE</p>
      <div class="notice">
        Trend start 17:45 BKK. Do not use keyword / hashtag before that time.<br>
        Comments focus only on excitement for Perth’s Kongthai.
      </div>
    </header>
    <div class="stats">
      <div class="count" id="count">Copied: 0 comments</div>
      <div class="pool" id="pool"></div>
    </div>
    <div class="preview empty" id="preview">Your comment will appear here.</div>
    <div class="actions">
      <button class="primary" id="generate" type="button">Generate &amp; Copy</button>
      <button class="secondary" id="post" type="button" disabled>Post X</button>
      <button class="toggle" id="extra" type="button" aria-pressed="false">
        <span class="switch"><i></i></span>
        <span id="extraLabel">Off: keyword + main hashtag</span>
      </button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script>
const LIMIT = 280;
const openings = [
  "Still so excited for Perth as Kongthai.",
  "Looking forward to following Perth’s Kongthai journey.",
  "Fans are ready to walk with Perth and Kongthai.",
  "Kongthai already feels special because of Perth.",
  "Can’t wait to see more of Perth as Kongthai.",
  "Supporting Perth and his character Kongthai all the way.",
  "Excited to discover Kongthai through Perth’s performance.",
  "Perth as Kongthai has so many fans waiting for him.",
  "Just here for Perth and the path of Kongthai.",
  "The journey with Perth as Kongthai is only beginning.",
  "Looking forward to every moment of Perth as Kongthai.",
  "Fans are happy to support Perth in the role of Kongthai.",
  "Kongthai’s story feels more special with Perth in it.",
  "Ready to follow Perth’s Kongthai from start to finish.",
  "Perth playing Kongthai already has hearts waiting.",
  "Excited to see how Perth brings Kongthai to life.",
  "Supporting Perth and looking forward to Kongthai’s path.",
  "The wait for more of Perth as Kongthai continues.",
  "Just happy to cheer for Perth and Kongthai together.",
  "Kongthai fans are here for Perth every step.",
  "Looking forward to the full journey of Perth as Kongthai.",
  "Perth as Kongthai is something many of us can’t wait for.",
  "Ready to support Perth and follow Kongthai’s story.",
  "Excited for everything Perth will show us as Kongthai.",
  "Fans are counting on Perth to carry Kongthai beautifully."
];
const middles = [
  "Looking forward to following the character’s path.",
  "Can’t wait to see how the story unfolds with him.",
  "Just happy to support Perth in this role.",
  "The character already feels special because of him.",
  "Hoping to see more of Kongthai soon.",
  "Fans are ready to walk this journey with Perth.",
  "Want to know more about the prince he is playing.",
  "Curious about every side of Kongthai.",
  "Just here to cheer for Perth and his character.",
  "Excited to discover Kongthai step by step."
];
const closers = [
  "Supporting Perth all the way as Kongthai.",
  "Ready to follow Kongthai’s story with him.",
  "This is only the beginning for Perth as Kongthai.",
  "Looking forward to every update from him.",
  "Let’s keep supporting Perth and Kongthai.",
  "Kongthai journey continues with Perth.",
  "Here for Perth and the character he carries.",
  "Can’t wait for more of Perth as Kongthai."
];

const pool = [];
openings.forEach(o => {
  middles.forEach(m => {
    closers.forEach(c => pool.push(o + " " + m + " " + c));
  });
});

let order = pool.map((_, i) => i);
let cursor = 0;
let copied = 0;
let current = "";
let lastBody = "";
let extraOn = false;

const countEl = document.getElementById("count");
const poolEl = document.getElementById("pool");
const preview = document.getElementById("preview");
const postBtn = document.getElementById("post");
const toast = document.getElementById("toast");
const extraBtn = document.getElementById("extra");
const extraLabel = document.getElementById("extraLabel");

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = list[i];
    list[i] = list[j];
    list[j] = tmp;
  }
}

shuffle(order);

function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 1400);
}

function suffix() {
  const tags = extraOn
    ? "#ScarletHeartTHLIVE\n#PerthTanapon"
    : "#ScarletHeartTHLIVE";
  return "\n\nPERTH AS KONGTHAI SHTH\n\n" + tags;
}

function build(body) {
  return body + suffix();
}

function refreshExtra() {
  extraBtn.classList.toggle("on", extraOn);
  extraBtn.setAttribute("aria-pressed", extraOn ? "true" : "false");
  extraLabel.textContent = extraOn
    ? "On: + #PerthTanapon"
    : "Off: keyword + main hashtag";
  if (!lastBody) return;
  current = build(lastBody);
  if (current.length > LIMIT) {
    lastBody = "";
    current = "";
    preview.textContent = "Your comment will appear here.";
    preview.classList.add("empty");
    postBtn.disabled = true;
    return;
  }
  preview.textContent = current;
  preview.classList.remove("empty");
  countEl.textContent = "Copied: " + copied + " comments";
}

async function generate() {
  const tail = suffix();
  const room = LIMIT - tail.length;
  let body = "";
  for (let n = 0; n < pool.length; n++) {
    if (cursor >= order.length) {
      shuffle(order);
      cursor = 0;
    }
    const next = pool[order[cursor++]];
    if (next.length <= room) {
      body = next;
      break;
    }
  }
  if (!body) {
    showToast("No comment fits.");
    return;
  }
  lastBody = body;
  current = build(body);
  preview.textContent = current;
  preview.classList.remove("empty");
  postBtn.disabled = false;
  try {
    await navigator.clipboard.writeText(current);
    copied += 1;
    countEl.textContent = "Copied: " + copied + " comments";
    showToast("Copied");
  } catch (err) {
    showToast("Copy failed. Select the text manually.");
  }
}

poolEl.textContent = "Pool: " + pool.length + " comments";
document.getElementById("generate").addEventListener("click", generate);
extraBtn.addEventListener("click", () => {
  extraOn = !extraOn;
  refreshExtra();
});
postBtn.addEventListener("click", () => {
  if (!current || current.length > LIMIT) return;
  window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(current), "_blank", "noopener");
});
document.addEventListener("keydown", (event) => {
  if (event.code !== "Space") return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON") return;
  event.preventDefault();
  generate();
});
</script>
</body>
</html>
