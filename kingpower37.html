<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Comment Generator · King Power 37th</title>
<style>
:root {
  --bg: #f6f1ec;
  --paper: #fffdfb;
  --ink: #2a2428;
  --muted: #6f6569;
  --line: #e5dcd6;
  --accent: #b83b4a;
  --accent-dark: #9a2f3c;
  --gold: #b7a08a;
  --chip: #f3ebe6;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
}
.wrap { max-width: 760px; margin: 0 auto; padding: 32px 18px 56px; }
h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
.sub { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
.notice {
  margin-top: 14px;
  padding: 10px 12px;
  background: var(--chip);
  border-left: 3px solid var(--gold);
  color: #4e4246;
  font-size: 14px;
}
.stats {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin: 22px 0 16px;
  font-size: 15px;
}
.count { font-weight: 600; }
.pool { color: var(--muted); }
.preview {
  min-height: 220px;
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 16px;
  white-space: pre-wrap;
  line-height: 1.55;
  font-size: 15px;
}
.preview.empty { color: var(--muted); }
.actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
button {
  appearance: none;
  border: 0;
  cursor: pointer;
  font: inherit;
  font-size: 13px;
  padding: 6px 10px;
  min-height: 32px;
}
.primary { background: var(--accent); color: #fff; }
.primary:hover { background: var(--accent-dark); }
.secondary {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--ink);
}
.secondary:hover { background: #f3e8eb; }
.secondary:disabled { opacity: 0.45; cursor: not-allowed; }
.toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  border: 0;
  background: transparent;
  color: var(--ink);
  padding: 0;
  min-height: 32px;
  cursor: pointer;
}
.switch {
  width: 36px;
  height: 20px;
  border-radius: 999px;
  background: #e0d0d6;
  position: relative;
  flex: 0 0 auto;
  transition: background 0.2s ease;
}
.switch i {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.2s ease;
}
.toggle.on .switch { background: var(--accent); }
.toggle.on .switch i { transform: translateX(16px); }
.toggle span { font-size: 13px; }
.toast {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%) translateY(12px);
  background: var(--ink);
  color: #fff;
  padding: 10px 14px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: 0.2s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>X Comment Generator</h1>
    <p class="sub">Job: PSD Family x King Power 37th Anniversary</p>
    <div class="notice">Press Generate &amp; Copy to get comment. Trend starts 18:00 BKK. Do not use keyword or hashtag before then.</div>
  </header>

  <div class="stats">
    <div class="count" id="count">Copied: 0 comments</div>
    <div class="pool" id="pool"></div>
  </div>

  <div class="preview empty" id="preview">Your comment will appear here.</div>

  <div class="actions">
    <button class="primary" id="generate" type="button">Generate &amp; Copy</button>
    <button class="secondary" id="post" type="button" disabled>Post X</button>
    <button class="toggle" id="extra" type="button">
      <div class="switch"><i></i></div>
      <span>Extra hashtags Off</span>
    </button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const LIMIT = 280;
const openings = [
  "PSD Family walks into King Power Rangnam together at 18:00.",
  "Perth Santa and Domiia take the atrium for the 37th anniversary.",
  "The Devil Family arrives and the floor settles at Rangnam.",
  "Domiia stays close to Perth and Santa during the half-time show.",
  "King Power’s anniversary night starts with the full PSD trio.",
  "Perth and Santa keep the center while Domiia moves around them.",
  "Rangnam feels brighter once the three stand together.",
  "Lucky Fans moment looks ready once PSD Family appears.",
  "Domiia’s energy matches the shopping race mood tonight.",
  "Perth checks Santa, Santa checks Domiia, easy loop at 18:00.",
  "The anniversary week opens with the right family on stage.",
  "PSD Family makes the Crown Atrium feel smaller and warmer.",
  "Domiia leads a little, then Perth and Santa pull him back.",
  "Fans catch the black-and-white theme on all three at Rangnam.",
  "The half-time show slot suits how the three already move.",
  "King Power Rangnam holds the moment when they arrive together.",
  "Perth stays calm, Santa smiles, Domiia adds the motion.",
  "Anniversary lights land clean on the PSD Family.",
  "They walk in as one and the crowd notices immediately.",
  "Domiia stands between Perth and Santa and refuses to move.",
  "The 18:00 start feels natural with the Devil Family present.",
  "Rangnam’s atrium changes once the three take their place."
];

const middles = [
  "They move as one even when Domiia wanders a step.",
  "Nothing feels staged. The family just stands there.",
  "Fans notice Domiia’s hand near Santa’s sleeve.",
  "Perth’s quiet sits next to Domiia’s restless energy.",
  "The black and white colors stay clear under the lights.",
  "Santa’s smile comes faster once Domiia is close.",
  "They leave space so Domiia can turn and come back.",
  "The devil theme stays light and fits the night.",
  "Perth and Santa keep their rhythm. Domiia adds motion.",
  "The floor quiets a little when the three stand still.",
  "Domiia pouts for a second then grins at both of them.",
  "The family moment needs no extra staging.",
  "Both Perth’s calm and Santa’s brightness show in Domiia.",
  "Fans catch the same colors on all three.",
  "Domiia stays close enough for Perth to touch his head.",
  "The anniversary feeling comes from how ordinary they look together.",
  "Santa fixes Domiia’s collar. Perth just waits.",
  "The setting fits how they already act as a unit.",
  "Lucky Fans privilege feels earned with them there.",
  "The shopping energy softens once the three appear."
];

const closers = [
  "Tonight belongs to the full PSD Family.",
  "Little Devils get Perth Santa plus Domiia at Rangnam.",
  "They leave the same way they arrived: together.",
  "King Power 37th now has one clear PSD night.",
  "Domiia keeps the energy. Perth and Santa keep the center.",
  "Fans leave with the same picture of the three.",
  "The evening stays simple and that works.",
  "They turn a regular slot into their own mark.",
  "Rangnam holds the moment as it is.",
  "The chemistry stays visible even when Domiia is loudest.",
  "Anniversary week looks more complete with them there.",
  "The landmark is just the three standing together again.",
  "Half-time show energy matches the family perfectly.",
  "Lucky Fans get the close view they wanted."
];

const pool = [];
openings.forEach(o => {
  middles.forEach(m => {
    closers.forEach(c => pool.push(o + " " + m + " " + c));
  });
});

let order = pool.map((_, i) => i);
let cursor = 0;
let copied = 0;
let current = "";
let extraOn = false;

const countEl = document.getElementById("count");
const poolEl = document.getElementById("pool");
const preview = document.getElementById("preview");
const postBtn = document.getElementById("post");
const toast = document.getElementById("toast");
const extraBtn = document.getElementById("extra");

poolEl.textContent = "Pool: " + pool.length + " comments";

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
}
shuffle(order);

function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 1400);
}

function suffix() {
  const tags = extraOn
    ? "#KingPower37thAnniversary\n#PerthSanta #DOMIIA"
    : "#KingPower37thAnniversary";
  return "\n\nPSD FAMILY 37TH KINGPOWER\n\n" + tags;
}

function build(body) {
  return body + suffix();
}

function refreshExtra() {
  extraBtn.classList.toggle("on", extraOn);
  extraBtn.querySelector("span").textContent = extraOn ? "Extra hashtags On" : "Extra hashtags Off";
}

async function generate() {
  const tail = suffix();
  const room = LIMIT - tail.length;
  let body = "";
  let found = false;
  for (let n = 0; n < pool.length; n++) {
    if (cursor >= order.length) {
      shuffle(order);
      cursor = 0;
    }
    const next = pool[order[cursor++]];
    if (next.length <= room) {
      body = next;
      found = true;
      break;
    }
  }
  if (!found) {
    showToast("No comment fits.");
    return;
  }
  current = build(body);
  preview.textContent = current;
  preview.classList.remove("empty");
  postBtn.disabled = false;
  try {
    await navigator.clipboard.writeText(current);
    copied++;
    countEl.textContent = "Copied: " + copied + " comments";
    showToast("Copied");
  } catch {
    showToast("Copy failed. Select the text manually.");
  }
}

document.getElementById("generate").addEventListener("click", generate);

postBtn.addEventListener("click", async () => {
  if (!current) return;
  window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(current), "_blank", "noopener");
});

extraBtn.addEventListener("click", () => {
  extraOn = !extraOn;
  refreshExtra();
  if (current) generate(); // refresh current if any
});

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
    e.preventDefault();
    generate();
  }
});
</script>
</body>
</html>
