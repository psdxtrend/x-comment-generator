<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PerthSanta Ralph Lauren · Comment Generator</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:720px;margin:30px auto;padding:16px;background:#f6f1ec;color:#1e2a2c}
  h1{font-size:1.35rem;margin:0 0 4px}
  .sub{color:#6a7678;font-size:.95rem;margin-bottom:14px}
  .notice{background:#eef5f5;border-left:4px solid #2c5d66;padding:10px 14px;font-size:.9rem;margin-bottom:18px}
  .preview{background:#fffdfb;border:1px solid #d7e3e4;border-radius:10px;padding:16px;min-height:140px;white-space:pre-wrap;line-height:1.55}
  .preview.empty{color:#6a7678}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
  button{background:#2c5d66;color:#fff;border:none;padding:10px 16px;border-radius:999px;cursor:pointer;font-size:.95rem}
  button.secondary{background:#fff;color:#1e2a2c;border:1px solid #d7e3e4}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:active{opacity:.85}
  .toggle{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #d7e3e4;border-radius:999px;padding:7px 12px;cursor:pointer;user-select:none}
  .switch{width:40px;height:22px;background:#ccc;border-radius:999px;position:relative}
  .switch i{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
  .toggle.on .switch{background:#2c5d66}
  .toggle.on .switch i{left:20px}
  .stats{font-size:.9rem;color:#6a7678;margin-bottom:8px}
</style>
</head>
<body>
  <h1>X Comment Generator</h1>
  <p class="sub">PerthSanta · Ralph’s Club New York Pop-Up · SM Makati</p>
  <div class="notice">
    Press Generate &amp; Copy. Trend starts 17:00 BKK. Limit 280 characters with keyword + hashtags.
  </div>

  <div class="stats">
    <span id="count">Copied: 0</span>
    <span id="pool" style="float:right"></span>
  </div>
  <div class="preview empty" id="preview">Your comment will appear here.</div>

  <div class="controls">
    <button id="gen">Generate &amp; Copy</button>
    <button class="secondary" id="post" disabled>Post X</button>
    <div class="toggle" id="extra">
      <span class="switch"><i></i></span>
      <span id="extraLabel">Off · keyword + main HS</span>
    </div>
  </div>

<script>
const LIMIT = 280;
let extra = false, copied = 0;
let current = "";
let lastBody = "";

const openings = [
  "Perth and Santa look at ease at Ralph’s Club New York.",
  "This Ralph Lauren moment with PerthSanta feels calm.",
  "Seeing PerthSanta at SM Makati for Ralph’s Club feels right.",
  "Perth and Santa carry the event with quiet confidence.",
  "The Ralph Lauren collaboration suits them naturally.",
  "PerthSanta bring a steady presence to the pop-up.",
  "Another clean look from Perth and Santa with Ralph Lauren.",
  "They make the Ralph’s Club setting feel intentional.",
  "PerthSanta handle this brand moment with ease.",
  "Ralph Lauren chose well with PerthSanta for the pop-up.",
  "Perth and Santa look comfortable with the fragrance.",
  "This Manila stop shows how far the pairing has come.",
  "PerthSanta keep delivering polished appearances.",
  "The way they show up for Ralph Lauren feels genuine.",
  "Perth and Santa fit Ralph’s Club New York perfectly.",
  "A quiet strong presence from PerthSanta at the venue.",
  "They represent every brand with care.",
  "PerthSanta make the pop-up feel more personal.",
  "Watching them at SM Makati today feels rewarding.",
  "Their professionalism stands out in every collaboration.",
  "PerthSanta arrive at the Ralph Lauren pop-up looking sharp.",
  "The pairing fits the New York Club vibe so well.",
  "Fans are happy to see Perth and Santa with Ralph Lauren.",
  "They keep the energy calm and elegant at the booth.",
  "Ralph’s Club New York looks better with PerthSanta here.",
  "Perth and Santa move through the pop-up with ease.",
  "This event highlights how natural they look together.",
  "The fragrance campaign suits their style perfectly.",
  "SM Makati gets a polished moment with PerthSanta.",
  "They continue to show up consistently for brands.",
  "PerthSanta bring quiet charm to Ralph Lauren today.",
  "The pop-up feels warmer with both of them present.",
  "Another successful brand stop for the pairing.",
  "They look settled and focused throughout the event.",
  "Ralph Lauren and PerthSanta make a clean combination.",
  "Fans appreciate the steady work they put in.",
  "Perth and Santa handle formal settings comfortably.",
  "The New York Club theme fits them without effort.",
  "This appearance adds another solid moment to their year.",
  "They keep delivering the same reliable presence."
];

const middles = [
  "Their chemistry stays natural even in formal settings.",
  "The professionalism they show is consistent.",
  "Every collaboration sits comfortably on them.",
  "They bring calm energy that works with the brand.",
  "It is clear why brands keep inviting them.",
  "Their presence adds steady warmth to the event.",
  "The pairing still feels fresh and well-balanced.",
  "They handle these moments without forcing anything.",
  "Support from the fandom stays quiet and steady.",
  "This opportunity reflects the work they put in.",
  "They look settled and focused throughout.",
  "The connection between them still reads clearly.",
  "Everything about their appearance feels measured.",
  "Fans can see the growth in how they carry themselves.",
  "The collaboration sits well with both of them.",
  "They keep the tone elegant without overdoing it.",
  "It is satisfying to watch them take these steps.",
  "Their approach remains simple and effective.",
  "The event benefits from their natural presence.",
  "They continue to open doors through consistency.",
  "Nothing feels staged in the way they stand together.",
  "The lights and setting frame them nicely.",
  "They stay composed while still looking approachable.",
  "This kind of campaign matches their current image.",
  "Perth and Santa keep the moment light and clean.",
  "Their outfits complement the Ralph Lauren palette.",
  "The booth feels more complete with both of them.",
  "They move with the same easy rhythm as always.",
  "Fans notice how comfortable they look side by side.",
  "The fragrance theme sits naturally on the pairing."
];

const endings = [
  "Wishing them a smooth schedule today.",
  "Hope the day runs well for both of them.",
  "Sending quiet support from everywhere.",
  "Looking forward to the photos later.",
  "May the rest of the event go smoothly.",
  "Proud of the way they keep showing up.",
  "Rooting for them as always.",
  "Happy to see them take this opportunity.",
  "Hoping everything stays on track today.",
  "Support stays with them throughout.",
  "Another good step for the pairing.",
  "They continue to represent well.",
  "The day already looks promising.",
  "Fans are here for every moment.",
  "Keep the good energy going."
];

function r(a) {
  return a[Math.floor(Math.random() * a.length)];
}

function suffix() {
  let f = "\n\nPERTHSANTA RALPHS CLUB POPUP\n\n#RalphLaurenFragrancesXPerthSanta";
  if (extra) f += "\n#PerthSanta #เพิร์ธแซนต้า";
  return f;
}

function build(b) {
  return b + suffix();
}

// Build large pool of valid comments (approx 20k+)
const pool = [];
openings.forEach(o => {
  middles.forEach(m => {
    endings.forEach(e => {
      const body = o + " " + m + " " + e;
      const fullOff = body + "\n\nPERTHSANTA RALPHS CLUB POPUP\n\n#RalphLaurenFragrancesXPerthSanta";
      if (fullOff.length <= LIMIT) pool.push(body);
    });
    // also 2-sentence versions
    const body2 = o + " " + m;
    const fullOff2 = body2 + "\n\nPERTHSANTA RALPHS CLUB POPUP\n\n#RalphLaurenFragrancesXPerthSanta";
    if (fullOff2.length <= LIMIT) pool.push(body2);
  });
});

let order = pool.map((_, i) => i);
let cursor = 0;

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
}
shuffle(order);

document.getElementById("pool").textContent = "Pool: " + pool.length + " comments";

function refreshExtra() {
  const el = document.getElementById("extra");
  el.classList.toggle("on", extra);
  document.getElementById("extraLabel").textContent = extra
    ? "On · + #PerthSanta #เพิร์ธแซนต้า"
    : "Off · keyword + main HS";

  if (!lastBody) return;
  current = build(lastBody);
  const preview = document.getElementById("preview");
  if (current.length > LIMIT) {
    preview.textContent = "Too long with extra tags (" + current.length + "). Generate again.";
    preview.classList.add("empty");
    document.getElementById("post").disabled = true;
    return;
  }
  preview.textContent = current;
  preview.classList.remove("empty");
  document.getElementById("post").disabled = false;
}

async function genCopy() {
  let body = "";
  let attempts = 0;
  while (attempts < pool.length) {
    if (cursor >= order.length) {
      shuffle(order);
      cursor = 0;
    }
    body = pool[order[cursor++]];
    current = build(body);
    if (current.length <= LIMIT) break;
    attempts++;
  }
  if (current.length > LIMIT) {
    document.getElementById("preview").textContent = "No fitting comment found. Try again.";
    document.getElementById("preview").classList.add("empty");
    document.getElementById("post").disabled = true;
    return;
  }

  lastBody = body;
  const preview = document.getElementById("preview");
  preview.textContent = current;
  preview.classList.remove("empty");
  document.getElementById("post").disabled = false;

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(current);
    } else {
      const ta = document.createElement("textarea");
      ta.value = current;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    copied++;
    document.getElementById("count").textContent = "Copied: " + copied;
  } catch (e) {
    alert("Copy failed – select text manually");
  }
}

document.getElementById("extra").onclick = () => {
  extra = !extra;
  refreshExtra();
};

document.getElementById("gen").onclick = genCopy;

document.getElementById("post").onclick = () => {
  if (!current || current.length > LIMIT) return;
  window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(current), "_blank", "noopener");
};
</script>
</body>
</html>
