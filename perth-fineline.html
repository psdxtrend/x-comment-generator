<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Comment Generator · Perth x Fineline Speed Wash</title>
<style>
  :root {
    --bg: #f2f6f6;
    --paper: #fffdfb;
    --ink: #1e2a2c;
    --muted: #6a7678;
    --line: #d7e3e4;
    --clinic: #2c5d66;
    --clinic-dark: #234a52;
    --gold: #b7a08a;
    --chip: #e8f0f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 18px 56px; }
  h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
  .sub { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
  .notice {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--chip);
    border-left: 3px solid var(--gold);
    color: #3d4a4c;
    font-size: 14px;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin: 22px 0 16px;
    font-size: 15px;
  }
  .count { font-weight: 600; }
  .pool { color: var(--muted); }
  .preview {
    min-height: 220px;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 16px;
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 15px;
  }
  .preview.empty { color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  button {
    appearance: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    padding: 6px 10px;
    min-height: 32px;
  }
  .primary { background: var(--clinic); color: #fff; }
  .primary:hover { background: var(--clinic-dark); }
  .secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  .secondary:hover { background: #e5eeee; }
  .secondary:disabled { opacity: 0.45; cursor: not-allowed; }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    border: 0;
    background: transparent;
    color: var(--ink);
    padding: 0;
    min-height: 32px;
    cursor: pointer;
  }
  .switch {
    width: 36px;
    height: 20px;
    border-radius: 999px;
    background: #c9d5d6;
    position: relative;
    flex: 0 0 auto;
    transition: background 0.2s ease;
  }
  .switch i {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s ease;
  }
  .toggle.on .switch { background: var(--clinic); }
  .toggle.on .switch i { transform: translateX(16px); }
  .toggle span { font-size: 13px; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: #fff;
    padding: 10px 14px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>X Comment Generator</h1>
      <p class="sub">Perth · Fineline Speed Wash 2in1 · Lotus’s Rama 4</p>
      <div class="notice">Press Generate &amp; Copy to get comment. Trend starts 13:45 BKK (1:45 PM). Do not use keyword or hashtag before then.</div>
    </header>
    <div class="stats">
      <div class="count" id="count">Copied: 0 comments</div>
      <div class="pool" id="pool"></div>
    </div>
    <div class="preview empty" id="preview">Your comment will appear here.</div>
    <div class="actions">
      <button class="primary" id="generate" type="button">Generate &amp; Copy</button>
      <button class="secondary" id="post" type="button" disabled>Post X</button>
      <button class="toggle" id="extra" type="button" aria-pressed="false">
        <span class="switch"><i></i></span>
        <span id="extraLabel">Off: keyword + main hashtag</span>
      </button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
const LIMIT = 280;

const openings = [
  "Perth steps into Lotus’s Rama 4 and the Speed Zone lights up right away.",
  "The second Perth appears at the Fineline booth, fans start screaming.",
  "Lotus’s Rama 4 turns electric the moment Perth walks in.",
  "Perth arrives and every camera locks on him instantly.",
  "The energy jumps the second Perth hits the stage area.",
  "Perth owns the Fineline Speed Wash event from the first second.",
  "Little devils lose it when Perth finally appears on stage.",
  "Perth walks out and the entire Lotus’s section erupts.",
  "Fineline Speed Wash just got the coolest guest possible today.",
  "Perth’s presence makes the whole event feel faster and brighter.",
  "The second Perth steps on stage, the crowd goes completely wild.",
  "Perth at Lotus’s Rama 4 is pure speed and pure charm.",
  "Fans already know this afternoon belongs to Perth.",
  "Perth tilts his head and the whole booth screams loudly.",
  "Lotus’s feels alive the moment Perth shows up.",
  "Perth makes the Fineline event look effortless and cool.",
  "Every angle finds Perth first at Rama 4 today.",
  "The Speed Zone goes quiet then explodes for Perth.",
  "Perth’s arrival turns the event into pure hype.",
  "Can’t stop smiling seeing Perth with Fineline today.",
  "From entrance to stage, Perth keeps the vibe high.",
  "Perth looks so sharp under the mall lights right now.",
  "The whole event area feels brighter with Perth here.",
  "Perth steps out and steals the show in seconds.",
  "Live streams lock onto Perth the moment he appears.",
  "Lucky fans finally get to see Perth up close today.",
  "Perth walks past the Speed Zone and everyone loses it.",
  "The moment Perth smiles, the whole Lotus’s cheers.",
  "Perth is here and the Fineline event just leveled up.",
  "Fans are already shaking when Perth comes into view."
];

const middles = [
  "That outfit is clean, sharp, and perfectly on brand for today.",
  "The fit sits so well under the lights — pure visual win.",
  "Perth looks comfortable, glowing, and completely in his element.",
  "Fineline’s setup frames him perfectly without overpowering him.",
  "The smile, the posture, the whole look just hits different.",
  "Fans catch every gesture and the energy stays nonstop.",
  "He waves, laughs, and the whole area stays locked on him.",
  "Speed Wash lights plus Perth’s presence create a cool glow.",
  "Nothing feels forced — he just lights up the booth naturally.",
  "The outfit details catch every flash and still look effortless.",
  "He keeps moving lightly while the crowd stays glued to him.",
  "Fineline gets a full dose of pure Perth charm today.",
  "That sharp expression mixed with the clean fit is deadly.",
  "Cameras keep finding him even when he steps slightly back.",
  "He matches the event energy then lifts it even higher.",
  "The whole Lotus’s feels better the longer he stays.",
  "Every clip already looks like a favorite moment.",
  "He stays playful and cool while the hype never drops.",
  "Outfit, smile, and presence all in perfect sync today.",
  "Fineline chose well — Perth makes the whole stop feel special.",
  "Perth looks so fresh and sharp in this Speed Wash look.",
  "The way he moves on stage matches the quick clean vibe.",
  "Fans can’t stop praising how good Perth looks today.",
  "Perth’s energy makes the whole program feel faster.",
  "He owns every second he spends with Fineline.",
  "Perth talks about the product and still looks this cool.",
  "The Speed Wash 2in1 vibe fits Perth perfectly.",
  "He makes quick clean look stylish without even trying.",
  "Perth interacts with fans and the energy doubles.",
  "Seeing Perth promote this just feels right."
];

const closers = [
  "Today Perth shines at Fineline.",
  "Lotus’s gets the coolest hour possible with him here.",
  "He leaves the same way he arrived: full of speed.",
  "Fineline Speed Wash now has one clear Perth moment.",
  "Fans leave with the same smile he gave them.",
  "The afternoon already feels complete with him there.",
  "Perth turns a product event into pure memory.",
  "Proud of our boy every single time he shows up.",
  "Another beautiful stage for Perth today.",
  "Live viewers get exactly the energy they came for.",
  "He makes the Speed Zone unforgettable.",
  "The energy stays high long after he moves on.",
  "Perth owns the afternoon without even trying hard.",
  "Fans already replaying every sharp second.",
  "This is the Rama 4 afternoon everyone will remember.",
  "Counting down every second until he appears again.",
  "Fineline plus Perth is a pure speed win.",
  "He keeps the spark and the event keeps the lights.",
  "Another day where Perth just quietly steals everything.",
  "Can’t wait to see more of this glowing version of him.",
  "Perth makes quick clean look this cool.",
  "The whole event feels better just because Perth is here.",
  "Fans are so happy seeing Perth with this job.",
  "Perth and Fineline is a perfect match today.",
  "He just makes everything look effortless.",
  "Lucky fans are living their best life right now.",
  "Perth’s smile at the end is already the highlight.",
  "This job fits Perth so well.",
  "The Speed Zone will remember Perth for a long time.",
  "Proud to see Perth doing this event."
];

const pool = [];
openings.forEach(o => {
  middles.forEach(m => {
    closers.forEach(c => pool.push(o + " " + m + " " + c));
  });
});

let order = pool.map((_, i) => i);
let cursor = 0;
let copied = 0;
let current = "";
let lastBody = "";
let extraOn = false;

const countEl = document.getElementById("count");
const poolEl = document.getElementById("pool");
const preview = document.getElementById("preview");
const postBtn = document.getElementById("post");
const toast = document.getElementById("toast");
const extraBtn = document.getElementById("extra");
const extraLabel = document.getElementById("extraLabel");

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
}
shuffle(order);

function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 1400);
}

function suffix() {
  const tags = extraOn
    ? "#FinelineSpeedWash2in1XPerth\n#PerthTanapon"
    : "#FinelineSpeedWash2in1XPerth";
  return "\n\nPERTH FINELINE QUICK CLEAN\n\n" + tags;
}

function build(body) {
  return body + suffix();
}

function refreshExtra() {
  extraBtn.classList.toggle("on", extraOn);
  extraBtn.setAttribute("aria-pressed", extraOn ? "true" : "false");
  extraLabel.textContent = extraOn
    ? "On: + #PerthTanapon"
    : "Off: keyword + main hashtag";
  if (!lastBody) return;
  current = build(lastBody);
  if (current.length > LIMIT) {
    lastBody = "";
    current = "";
    preview.textContent = "Your comment will appear here.";
    preview.classList.add("empty");
    postBtn.disabled = true;
    return;
  }
  preview.textContent = current;
  preview.classList.remove("empty");
}

async function generate() {
  const tail = suffix();
  const room = LIMIT - tail.length;
  let body = "";
  for (let n = 0; n < pool.length; n++) {
    if (cursor >= order.length) {
      shuffle(order);
      cursor = 0;
    }
    const next = pool[order[cursor++]];
    if (next.length <= room) {
      body = next;
      break;
    }
  }
  if (!body) {
    showToast("No comment fits.");
    return;
  }
  lastBody = body;
  current = build(body);
  preview.textContent = current;
  preview.classList.remove("empty");
  postBtn.disabled = false;
  try {
    await navigator.clipboard.writeText(current);
    copied += 1;
    countEl.textContent = "Copied: " + copied + " comments";
    showToast("Copied");
  } catch (err) {
    showToast("Copy failed. Select the text manually.");
  }
}

poolEl.textContent = "Pool: " + pool.length + " comments";
document.getElementById("generate").addEventListener("click", generate);
extraBtn.addEventListener("click", () => {
  extraOn = !extraOn;
  refreshExtra();
});
postBtn.addEventListener("click", () => {
  if (!current || current.length > LIMIT) return;
  window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(current), "_blank", "noopener");
});
document.addEventListener("keydown", (event) => {
  if (event.code !== "Space") return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON") return;
  event.preventDefault();
  generate();
});
</script>
</body>
</html>
