<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Comment Generator · Perth x Lotus Live</title>
<style>
 :root {
 --bg: #f4f7f3;
 --paper: #fffdfb;
 --ink: #243028;
 --muted: #6d776f;
 --line: #dce6dc;
 --accent: #2f6b45;
 --accent-dark: #245538;
 --gold: #c4a574;
 --chip: #eaf1eb;
 }
 * { box-sizing: border-box; }
 body {
 margin: 0;
 min-height: 100vh;
 font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
 background: var(--bg);
 color: var(--ink);
 }
 .wrap { max-width: 760px; margin: 0 auto; padding: 32px 18px 56px; }
 h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
 .sub { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
 .notice {
 margin-top: 14px;
 padding: 10px 12px;
 background: var(--chip);
 border-left: 3px solid var(--gold);
 color: #3e4a41;
 font-size: 14px;
 }
 .options {
 margin: 18px 0 8px;
 font-size: 14px;
 }
 .options label {
 display: flex;
 align-items: center;
 gap: 8px;
 cursor: pointer;
 user-select: none;
 }
 .stats {
 display: flex;
 justify-content: space-between;
 gap: 12px;
 margin: 18px 0 16px;
 font-size: 15px;
 }
 .count { font-weight: 600; }
 .pool { color: var(--muted); }
 .preview {
 min-height: 220px;
 background: var(--paper);
 border: 1px solid var(--line);
 padding: 16px;
 white-space: pre-wrap;
 line-height: 1.55;
 font-size: 15px;
 }
 .preview.empty { color: var(--muted); }
 .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
 button {
 appearance: none;
 border: 0;
 cursor: pointer;
 font: inherit;
 font-size: 13px;
 padding: 6px 10px;
 min-height: 32px;
 }
 .primary { background: var(--accent); color: #fff; }
 .primary:hover { background: var(--accent-dark); }
 .secondary {
 background: transparent;
 color: var(--ink);
 border: 1px solid var(--ink);
 }
 .secondary:hover { background: #e7eee8; }
 .secondary:disabled { opacity: 0.45; cursor: not-allowed; }
 .toast {
 position: fixed;
 left: 50%;
 bottom: 22px;
 transform: translateX(-50%) translateY(12px);
 background: var(--ink);
 color: #fff;
 padding: 10px 14px;
 font-size: 14px;
 opacity: 0;
 pointer-events: none;
 transition: 0.2s ease;
 }
 .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
 <div class="wrap">
 <header>
 <h1>X Comment Generator</h1>
 <p class="sub">English only. Short comments.</p>
 <div class="notice">Press Space to Generate and Copy. Trend start 11:30. Do not use the keyword or hashtag before then.</div>
 </header>

 <div class="options">
 <label>
 <input type="checkbox" id="extraTags" checked>
 Thêm hashtag phụ (#PerthTanapon)
 </label>
 </div>

 <div class="stats">
 <div class="count" id="count">Copied: 0 comments</div>
 <div class="pool" id="pool"></div>
 </div>
 <div class="preview empty" id="preview">Your comment will appear here.</div>
 <div class="actions">
 <button class="primary" id="generate" type="button">Generate &amp; Copy</button>
 <button class="secondary" id="post" type="button" disabled>Space</button>
 </div>
 </div>
 <div class="toast" id="toast"></div>

<script>
const openings = [
 "Perth is on Lotus Live right now.",
 "Lotus Live with Perth is running smoothly.",
 "Perth appears on the Lotus stream today.",
 "The Lotus live feels steady with Perth on it.",
 "Perth joins the Lotus App live this afternoon.",
 "Lotus Live is currently featuring Perth.",
 "Perth is present on the Lotus shopping live.",
 "The stream on Lotus is moving at a good pace with Perth.",
 "Perth and Lotus Live are on at the same time.",
 "Lotus App live has Perth in the frame.",
 "Perth is taking part in the Lotus Live session.",
 "The Lotus live continues with Perth on screen.",
 "Perth shows up for the Lotus shopping stream.",
 "Lotus Live keeps a clear flow with Perth there.",
 "Perth is part of today’s Lotus Live.",
 "The live on Lotus stays simple with Perth.",
 "Perth is visible on the Lotus App live.",
 "Lotus Live is underway with Perth.",
 "Perth takes the live slot for Lotus today.",
 "The Lotus stream includes Perth this round."
];

const middles = [
 "The live is progressing without interruption.",
 "Everything is moving at a normal pace.",
 "The session looks organized so far.",
 "The flow stays consistent throughout.",
 "It remains easy to follow.",
 "The stream keeps a steady rhythm.",
 "No major delays on the live.",
 "The presentation stays clear.",
 "The live continues as planned.",
 "It holds a regular tempo.",
 "The overall pace is stable.",
 "Things are running in order.",
 "The live maintains its structure.",
 "It stays on track.",
 "The session is holding steady."
];

const closers = [
 "The live is still ongoing.",
 "Viewers are watching the stream.",
 "The session continues.",
 "It remains active at the moment.",
 "The live is in progress.",
 "People are following along.",
 "The stream is still up.",
 "It keeps going as scheduled.",
 "The live has not ended yet.",
 "Viewers stay on the stream.",
 "The session is still live.",
 "It continues without pause.",
 "The live remains open.",
 "People are still tuned in.",
 "The stream is active now."
];

const pool = [];
openings.forEach(o => {
 middles.forEach(m => {
 closers.forEach(c => pool.push(o + " " + m + " " + c));
 });
});

let order = pool.map((_, i) => i);
let cursor = 0;
let copied = 0;
let current = "";

const countEl = document.getElementById("count");
const poolEl = document.getElementById("pool");
const preview = document.getElementById("preview");
const postBtn = document.getElementById("post");
const toast = document.getElementById("toast");
const extraTags = document.getElementById("extraTags");

poolEl.textContent = "Pool: " + pool.length + " comments";

function shuffle(list) {
 for (let i = list.length - 1; i > 0; i--) {
 const j = Math.floor(Math.random() * (i + 1));
 [list[i], list[j]] = [list[j], list[i]];
 }
}
shuffle(order);

function showToast(text) {
 toast.textContent = text;
 toast.classList.add("show");
 clearTimeout(showToast._t);
 showToast._t = setTimeout(() => toast.classList.remove("show"), 1400);
}

function build(body) {
 let text = body + "\n\nPERTH LOTUSS LIVE SHOP\n\n#LotussAppXPerth";
 if (extraTags.checked) {
 text += "\n#PerthTanapon";
 }
 return text;
}

async function generate() {
 if (cursor >= order.length) {
 shuffle(order);
 cursor = 0;
 }
 current = build(pool[order[cursor++]]);
 preview.textContent = current;
 preview.classList.remove("empty");
 postBtn.disabled = false;
 try {
 await navigator.clipboard.writeText(current);
 copied += 1;
 countEl.textContent = "Copied: " + copied + " comments";
 showToast("Copied");
 } catch (err) {
 showToast("Copy failed. Select the text manually.");
 }
}

document.getElementById("generate").addEventListener("click", generate);
postBtn.addEventListener("click", async () => {
 await generate();
 if (!current) return;
 window.open("https://x.com/intent/tweet?text=" + encodeURIComponent(current), "_blank", "noopener");
});

document.addEventListener("keydown", (event) => {
 if (event.code !== "Space") return;
 const tag = document.activeElement && document.activeElement.tagName;
 if (tag === "INPUT" || tag === "TEXTAREA") return;
 event.preventDefault();
 generate();
});
</script>
</body>
</html>
