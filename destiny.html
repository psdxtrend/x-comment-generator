<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Comment Generator · Destiny Clinic x PerthSanta</title>
<style>
  :root { --bg:#f4f7f3; --paper:#fffdfb; --ink:#243028; --muted:#6d776f; --line:#dce6dc; --accent:#3d6b52; --accent-dark:#2d5340; --gold:#c4a574; --chip:#eaf1eb; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:760px; margin:0 auto; padding:32px 18px 56px; }
  h1 { margin:0 0 8px; font-size:28px; font-weight:600; letter-spacing:-0.03em; }
  .sub { margin:0; color:var(--muted); line-height:1.5; font-size:15px; }
  .notice { margin-top:14px; padding:10px 12px; background:var(--chip); border-left:3px solid var(--gold); color:#3e4a41; font-size:14px; }
  .stats { display:flex; justify-content:space-between; gap:12px; margin:22px 0 16px; font-size:15px; }
  .count { font-weight:600; } .pool { color:var(--muted); }
  .preview { min-height:220px; background:var(--paper); border:1px solid var(--line); padding:16px; white-space:pre-wrap; line-height:1.55; font-size:15px; }
  .preview.empty { color:var(--muted); }
  .actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  button { appearance:none; border:0; cursor:pointer; font:inherit; font-size:13px; padding:6px 10px; min-height:32px; }
  .primary { background:var(--accent); color:#fff; } .primary:hover { background:var(--accent-dark); }
  .secondary { background:transparent; color:var(--ink); border:1px solid var(--ink); }
  .secondary:hover { background:#e7eee8; } .secondary:disabled { opacity:.45; cursor:not-allowed; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(12px); background:var(--ink); color:#fff; padding:10px 14px; font-size:14px; opacity:0; pointer-events:none; transition:.2s ease; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>X Comment Generator</h1>
      <p class="sub">English only. Short comments.</p>
      <div class="notice">Press Space to Generate and Copy. Trend start 17:45. Do not use the keyword or hashtag before then.</div>
    </header>
    <div class="stats">
      <div class="count" id="count">Copied: 0 comments</div>
      <div class="pool" id="pool"></div>
    </div>
    <div class="preview empty" id="preview">Your comment will appear here.</div>
    <div class="actions">
      <button class="primary" id="generate" type="button">Generate &amp; Copy</button>
      <button class="secondary" id="post" type="button" disabled>Space</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script>
const openings = [
  "Central Rama 2 settles once PerthSanta reach the Destiny Clinic corner.",
  "Perth holds the still half while Santa warms the clinic frame.",
  "Destiny Clinic looks less like a counter when both of them share it.",
  "Rama 2 evening light sits kinder on their faces than the flash.",
  "The bloom here reads as tended skin, not a backdrop slogan.",
  "Santa leans toward the greeting. Perth keeps the aisle open.",
  "A clinic stop rarely feels this unforced.",
  "Their black-and-white contrast stays clean against the floral trim.",
  "Mall noise stays outside the shot.",
  "PerthSanta leave the treatment story visible.",
  "The booth gets a human scale from the pair.",
  "Santa's ease pulls the corner nearer.",
  "Perth does not push the glow. He just stands in it.",
  "Rama 2 gives them room, and they use the room.",
  "Looked-after faces, ordinary warmth. That mix works.",
  "The pairing feels like care beside chemistry.",
  "No one rushes the first hello.",
  "Skin detail survives the crowd.",
  "Destiny Clinic chose faces that do not outshine the result.",
  "Evening at the clinic suits their pace.",
  "Both stay long enough for the finish to register.",
  "The floral set never takes the shot.",
  "Santa smiles without shoving the program forward.",
  "Central Rama 2 suddenly has a center.",
  "They share one temperature. The booth follows."
];
const middles = [
  "The finish stays even under mall light.",
  "Nothing in the corner looks overworked.",
  "Treatment talk stays light because the faces already explain it.",
  "The result sits on real features.",
  "Booth and pair share one glance.",
  "Pace is slow enough to remember.",
  "No stiff pose left in the frame.",
  "The clinic point remains readable.",
  "Warmth does not cover the program.",
  "Detail holds from the aisle."
];
const closers = [
  "Rama 2 can keep this tempo.",
  "A later frame in the same mood would fit.",
  "The evening holds because nobody forces the next beat.",
  "Worth staying with.",
  "The balance is the part that lands.",
  "This clinic hour earns another look.",
  "Saving the rest of the attention for what follows.",
  "Quiet is doing the work."
];
const pool = [];
openings.forEach(function (o) {
  middles.forEach(function (m) {
    closers.forEach(function (c) { pool.push(o + " " + m + " " + c); });
  });
});
let order = pool.map(function (_, i) { return i; });
let cursor = 0, copied = 0, current = "";
const countEl = document.getElementById("count");
const poolEl = document.getElementById("pool");
const preview = document.getElementById("preview");
const postBtn = document.getElementById("post");
const toast = document.getElementById("toast");
poolEl.textContent = "Pool: " + pool.length + " comments";
function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = list[i]; list[i] = list[j]; list[j] = tmp;
  }
}
shuffle(order);
function showToast(text) {
  toast.textContent = text; toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function () { toast.classList.remove("show"); }, 1400);
}
function build(body) {
  return body + "\n\nPERTHSANTA BEAUTY BLOOM\n\n#destinyclinicxPerthSanta";
}
async function generate() {
  if (cursor >= order.length) { shuffle(order); cursor = 0; }
  current = build(pool[order[cursor++]]);
  preview.textContent = current;
  preview.classList.remove("empty");
  postBtn.disabled = false;
  try {
    await navigator.clipboard.writeText(current);
    copied += 1;
    countEl.textContent = "Copied: " + copied + " comments";
    showToast("Copied");
  } catch (err) {
    showToast("Copy failed. Select the text manually.");
  }
}
document.getElementById("generate").addEventListener("click", generate);
postBtn.addEventListener("click", async function () {
  await generate();
  if (!current) return;
  window.open("https://x.com/intent/tweet?text=" + encodeURIComponent(current), "_blank", "noopener");
});
document.addEventListener("keydown", function (event) {
  if (event.code !== "Space") return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  event.preventDefault();
  generate();
});
</script>
</body>
</html>
