<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X Comment Generator · Destiny Clinic x PerthSanta</title>
<style>
  :root { --bg:#f4f7f3; --paper:#fffdfb; --ink:#243028; --muted:#6d776f; --line:#dce6dc; --accent:#3d6b52; --accent-dark:#2d5340; --gold:#c4a574; --chip:#eaf1eb; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:760px; margin:0 auto; padding:32px 18px 56px; }
  h1 { margin:0 0 8px; font-size:28px; font-weight:600; letter-spacing:-0.03em; }
  .notice { margin-top:14px; padding:10px 12px; background:var(--chip); border-left:3px solid var(--gold); color:#3e4a41; font-size:14px; }
  .stats { display:flex; justify-content:space-between; gap:12px; margin:22px 0 16px; font-size:15px; }
  .count { font-weight:600; } .pool { color:var(--muted); }
  .preview { min-height:220px; background:var(--paper); border:1px solid var(--line); padding:16px; white-space:pre-wrap; line-height:1.55; font-size:15px; }
  .preview.empty { color:var(--muted); }
  .actions { display:flex; gap:8px; margin-top:12px; }
  button { appearance:none; border:0; cursor:pointer; font:inherit; font-size:13px; padding:6px 10px; min-height:32px; }
  .primary { background:var(--accent); color:#fff; } .primary:hover { background:var(--accent-dark); }
  .secondary { background:transparent; color:var(--ink); border:1px solid var(--ink); }
  .secondary:hover { background:#e7eee8; } .secondary:disabled { opacity:.45; cursor:not-allowed; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(12px); background:var(--ink); color:#fff; padding:10px 14px; font-size:14px; opacity:0; pointer-events:none; transition:.2s ease; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>X Comment Generator</h1>
      <div class="notice">Press Space to Generate and Copy. Trend start 17:45. Do not use the keyword or hashtag before then.</div>
    </header>
    <div class="stats"><div class="count" id="count">Copied: 0 comments</div><div class="pool" id="pool"></div></div>
    <div class="preview empty" id="preview">Your comment will appear here.</div>
    <div class="actions">
      <button class="primary" id="generate" type="button">Generate &amp; Copy</button>
      <button class="secondary" id="post" type="button" disabled>Space</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script>
const who = ["PerthSanta","Perth and Santa","Santa beside Perth","Perth next to Santa","the PerthSanta pair","Santa with Perth"];
const brand = ["Destiny Clinic","the Destiny Clinic booth","Destiny Clinic at Rama 2","Destiny Clinic’s corner","the Destiny Clinic stop"];
const act = ["settle into","brighten","steady","soften","anchor","open","ground","warm","center","clarify"];
const see = ["even skin","a tended glow","a calm finish","real texture","an unforced bloom","looked-after faces","a clear result","soft clinic light","no stiff pose","a readable treatment story"];
const tail = ["Rama 2 can hold this.","Worth the evening slot.","The mall noise stays outside.","Fans get the pair and the clinic.","No hard pitch needed.","The floral set stays behind them.","Another pass would still fit.","The hour earns the stop.","Black and white against the clinic palette works.","They don’t chase the crowd."];
const forms = [
  (i) => ${who[i%6]} ${act[i%10]} ${brand[(i*3)%5]}, and ${see[(i*5)%10]} does the rest.,
  (i) => ${brand[i%5]} looks closer once ${who[(i*2)%6]} share the frame. ${tail[i%10]},
  (i) => At Central Rama 2, ${who[(i*4)%6]} let ${brand[(i*2)%5]} stay visible. ${see[(i*7)%10]} shows.,
  (i) => ${who[(i*5)%6]} keep ${brand[i%5]} from turning into a slogan. ${tail[(i*3)%10]},
  (i) => Santa takes the warmer side, Perth the still one, and ${brand[(i*4)%5]} gets both. ${see[i%10]}.,
  (i) => ${brand[(i*3)%5]} chose ${who[i%6]} well. ${see[(i*4)%10]} lands before the pose.,
  (i) => What reads first is ${who[(i*3)%6]}, then ${brand[i%5]}, then ${see[(i*2)%10]}.,
  (i) => ${who[(i*7)%6]} don’t cover ${brand[(i*5)%5]}. ${tail[(i*4)%10]},
  (i) => Rama 2 evening, ${brand[i%5]}, ${who[(i*2)%6]} in the same light. ${see[(i*3)%10]}.,
  (i) => ${brand[(i*2)%5]} feels like care because ${who[i%6]} refuse the hard sell. ${tail[(i*5)%10]},
  (i) => Perth holds ${brand[i%5]} steady while Santa makes it personal. ${see[(i*6)%10]}.,
  (i) => ${who[(i*4)%6]} plus ${brand[(i*3)%5]} is the Rama 2 reason to stop. ${tail[i%10]}
];
const comments = [];
const seen = new Set();
for (let n = 0; comments.length < 2000 && n < 8000; n++) {
  const line = forms[n % forms.length](n);
  if (seen.has(line)) continue;
  seen.add(line);
  comments.push(line);
}
let order = comments.map((_, i) => i);
let cursor = 0, copied = 0, current = "";
const countEl = document.getElementById("count");
const poolEl = document.getElementById("pool");
const preview = document.getElementById("preview");
const postBtn = document.getElementById("post");
const toast = document.getElementById("toast");
poolEl.textContent = "Pool: " + comments.length + " comments";
function shuffle(list) { for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = list[i]; list[i] = list[j]; list[j] = t; } }
shuffle(order);
function showToast(text) { toast.textContent = text; toast.classList.add("show"); clearTimeout(showToast._t); showToast._t = setTimeout(() => toast.classList.remove("show"), 1400); }
function build(body) { return body + "\n\nPERTHSANTA BEAUTY BLOOM\n\n#destinyclinicxPerthSanta"; }
async function generate() {
  if (cursor >= order.length) { shuffle(order); cursor = 0; }
  current = build(comments[order[cursor++]]);
  preview.textContent = current; preview.classList.remove("empty"); postBtn.disabled = false;
  try { await navigator.clipboard.writeText(current); copied++; countEl.textContent = "Copied: " + copied + " comments"; showToast("Copied"); }
  catch (e) { showToast("Copy failed. Select the text manually."); }
}
document.getElementById("generate").addEventListener("click", generate);
postBtn.addEventListener("click", async () => { await generate(); if (current) window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(current), "_blank", "noopener"); });
document.addEventListener("keydown", (e) => { if (e.code !== "Space") return; const tag = document.activeElement && document.activeElement.tagName; if (tag === "INPUT" || tag === "TEXTAREA") return; e.preventDefault(); generate(); });
</script>
</body>
</html>
