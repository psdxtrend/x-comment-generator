<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X Comment Generator · L'Oreal Cloud Stick x Santa</title>
<style>
  :root { --bg:#f4f7fb; --paper:#fffdfb; --ink:#1c2430; --muted:#6c7582; --line:#dce3ee; --accent:#1a1a1a; --accent-dark:#000; --gold:#c4a574; --chip:#eef3f8; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:760px; margin:0 auto; padding:32px 18px 56px; }
  h1 { margin:0 0 8px; font-size:28px; font-weight:600; letter-spacing:-0.03em; }
  .notice { margin-top:14px; padding:10px 12px; background:var(--chip); border-left:3px solid var(--gold); color:#3e4654; font-size:14px; }
  .stats { display:flex; justify-content:space-between; gap:12px; margin:22px 0 16px; font-size:15px; }
  .count { font-weight:600; } .pool { color:var(--muted); }
  .preview { min-height:220px; background:var(--paper); border:1px solid var(--line); padding:16px; white-space:pre-wrap; line-height:1.55; font-size:15px; }
  .preview.empty { color:var(--muted); }
  .actions { display:flex; gap:8px; margin-top:12px; }
  button { appearance:none; border:0; cursor:pointer; font:inherit; font-size:13px; padding:6px 10px; min-height:32px; }
  .primary { background:var(--accent); color:#fff; } .primary:hover { background:var(--accent-dark); }
  .secondary { background:transparent; color:var(--ink); border:1px solid var(--ink); }
  .secondary:hover { background:#e8eef6; } .secondary:disabled { opacity:.45; cursor:not-allowed; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(12px); background:var(--ink); color:#fff; padding:10px 14px; font-size:14px; opacity:0; pointer-events:none; transition:.2s ease; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>X Comment Generator</h1>
      <div class="notice">Press Space to Generate and Copy. Live starts 12:00. Do not use the keyword or hashtag before then.</div>
    </header>
    <div class="stats"><div class="count" id="count">Copied: 0 comments</div><div class="pool" id="pool"></div></div>
    <div class="preview empty" id="preview">Your comment will appear here.</div>
    <div class="actions">
      <button class="primary" id="generate" type="button">Generate &amp; Copy</button>
      <button class="secondary" id="post" type="button" disabled>Space</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script>
const openings = [
  "Santa looks calm with the Cloud Skin Sun Stick on the noon live.",
  "This Santa and L'Oreal stop feels soft, not staged.",
  "Cloud Skin with Santa has a clean rhythm.",
  "The TikTok frame gives the stick air and Santa uses it well.",
  "The pairing feels like care meeting a clear finish.",
  "Santa keeps the sun stick ordinary instead of performing it.",
  "Noon light and Santa make UV Defender easy to read.",
  "L'Oreal's sun stick finally has Santa's pace.",
  "Santa on the shop live lets the stick finish the line.",
  "A pocket sun stick looks believable once Santa holds it.",
  "Santa swipes Cloud Skin like a routine step, not a claim.",
  "The live stays tight and Santa doesn't lecture the SPF.",
  "UV Defender Cloud Skin sits in Santa's hand longer than the slogan.",
  "Santa's cheek does the convincing for the sun stick.",
  "L'Oreal Paris gets a calm host in Santa at noon.",
  "The ring light stays honest and Santa doesn't cover it.",
  "Santa treats the sun stick like a bag product, shown like one.",
  "Cloud Skin on Santa reads as skin, not a filter.",
  "The noon TikTok shop keeps Santa and the stick in the same frame.",
  "Santa reappplies without turning it into a demo.",
  "What the live catches is Santa, then the stick, then the finish.",
  "Santa names UV Defender and lets the texture stay visible.",
  "A sun stick demo usually stiffens. Santa keeps it ordinary.",
  "L'Oreal's Cloud Skin has Santa's unhurried swipe.",
  "Santa for Cloud Skin stays readable from 12 to 1."
];
const middles = [
  "No white cast does the convincing.",
  "The sheer cloud layer still looks like skin.",
  "A glide that doesn't lift makeup is the point.",
  "SPF without chalk stays easy to believe.",
  "The finish settles and the face stays readable.",
  "Texture still visible under the ring light.",
  "No grease, just an even cheek on camera.",
  "One swipe is enough to check the claim.",
  "The label stays in frame without taking the face.",
  "Useful at real size, not a staged close-up."
];
const closers = [
  "The live doesn't lecture.",
  "Noon light is honest enough.",
  "He doesn't perform the claim.",
  "Shop link, face still readable.",
  "The hour stays tight, 12 to 1.",
  "Polaroid energy stays secondary to the stick.",
  "A bag product, shown like one.",
  "Hoping the next frame keeps this quiet pace."
];
const comments = [];
openings.forEach(o => {
  middles.forEach(m => {
    closers.forEach(c => comments.push(o + " " + m + " " + c));
  });
});
let order = comments.map((_, i) => i);
let cursor = 0, copied = 0, current = "";
const countEl = document.getElementById("count");
const poolEl = document.getElementById("pool");
const preview = document.getElementById("preview");
const postBtn = document.getElementById("post");
const toast = document.getElementById("toast");
poolEl.textContent = "Pool: " + comments.length + " comments";
function shuffle(list) { for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = list[i]; list[i] = list[j]; list[j] = t; } }
shuffle(order);
function showToast(text) { toast.textContent = text; toast.classList.add("show"); clearTimeout(showToast._t); showToast._t = setTimeout(() => toast.classList.remove("show"), 1400); }
function build(body) { return body + "\n\nSANTA CLOUD SKIN SUNSTICK\n\n#LOrealCloudStickxSanta"; }
async function generate() {
  if (cursor >= order.length) { shuffle(order); cursor = 0; }
  current = build(comments[order[cursor++]]);
  preview.textContent = current; preview.classList.remove("empty"); postBtn.disabled = false;
  try { await navigator.clipboard.writeText(current); copied++; countEl.textContent = "Copied: " + copied + " comments"; showToast("Copied"); }
  catch (e) { showToast("Copy failed. Select the text manually."); }
}
document.getElementById("generate").addEventListener("click", generate);
postBtn.addEventListener("click", async () => { await generate(); if (current) window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(current), "_blank", "noopener"); });
document.addEventListener("keydown", (e) => { if (e.code !== "Space") return; const tag = document.activeElement && document.activeElement.tagName; if (tag === "INPUT" || tag === "TEXTAREA") return; e.preventDefault(); generate(); });
</script>
</body>
</html>
