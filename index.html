<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Comment Generator</title>
<style>
  :root {
    --bg: #f6f1ec;
    --paper: #fffdfb;
    --ink: #2a2422;
    --muted: #7a706a;
    --line: #e6dbd3;
    --rose: #8d3b4a;
    --green: #2f6b4f;
    --chip: #f3ebe4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 18px 56px; }
  h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
  .sub { margin: 0 0 22px; color: var(--muted); line-height: 1.5; font-size: 15px; }
  a.card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 16px 16px 14px;
    margin-bottom: 12px;
  }
  a.card:hover { border-color: #c9b8ae; }
  .tag {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #fff;
    padding: 3px 8px;
    margin-bottom: 8px;
  }
  .tag.hair { background: var(--green); }
  .tag.venus { background: var(--rose); }
  h2 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
  p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .go { margin-top: 10px; font-size: 13px; color: var(--ink); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>X Comment Generator</h1>
    <p class="sub">Pick a job. Each link opens its own comment page.</p>

    <a class="card" href="gohair.html">
      <span class="tag hair">Go Hair</span>
      <h2>Perth x Go Hair</h2>
      <p>Tops of Beauty, Central Pinklao. Trend start 19:15.</p>
      <div class="go">Open generator →</div>
    </a>

    <a class="card" href="venus.html">
      <span class="tag venus">Venus</span>
      <h2>Santa x Gillette Venus</h2>
      <p>Tops of Beauty, Central Pinklao. Trend start 16:45.</p>
      <div class="go">Open generator →</div>
    </a>
  </div>
</body>
</html>
