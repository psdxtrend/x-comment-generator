<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Comment Generator</title>
<style>
  :root {
    --bg: #f7f3f6;
    --paper: #fffdfb;
    --ink: #2a2428;
    --muted: #7a6e74;
    --line: #e6dbe2;
    --rose: #8d3b5a;
    --rose-dark: #722f48;
    --gold: #b7a08a;
    --chip: #f3ebe4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 18px 56px; }
  h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
  .sub { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
  .notice {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--chip);
    border-left: 3px solid var(--gold);
    color: #4e463f;
    font-size: 14px;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin: 22px 0 16px;
    font-size: 15px;
  }
  .count { font-weight: 600; }
  .pool { color: var(--muted); }
  .preview {
    min-height: 220px;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 16px;
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 15px;
  }
  .preview.empty { color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button {
    appearance: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    padding: 6px 10px;
    min-height: 32px;
  }
  .primary { background: var(--rose); color: #fff; flex: 0 0 auto; }
  .primary:hover { background: var(--rose-dark); }
  .secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
    flex: 0 0 auto;
  }
  .secondary:hover { background: #efe8e1; }
  .secondary:disabled { opacity: 0.45; cursor: not-allowed; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: #fff;
    padding: 10px 14px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>X Comment Generator</h1>
      <p class="sub">English only. Longer comments, written to invite a reply.</p>
      <div class="notice">Press Space to Generate and Copy. Trend start 16:45. Do not use the keyword or hashtag before then.</div>
    </header>
    <div class="stats">
      <div class="count" id="count">Copied: 0 comments</div>
      <div class="pool" id="pool"></div>
    </div>
    <div class="preview empty" id="preview">Your comment will appear here.</div>
    <div class="actions">
      <button class="primary" id="generate" type="button">Generate &amp; Copy</button>
      <button class="secondary" id="post" type="button" disabled>Post X</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script>
const openings = [
  "Santa looks calm beside Gillette Venus at Tops, and that calm is what holds the afternoon together.",
  "This Santa and Venus stop does not feel staged. The booth stays soft, and the face stays close.",
  "Gillette Venus with Santa has a clean rhythm. Neither side has to push to stay visible.",
  "Central Pinklao gives this Tops of Beauty slot air, and Santa uses that air instead of filling it.",
  "The pairing reads as care meeting a clear finish. Santa keeps the frame personal, Venus keeps the result sharp.",
  "Watching Santa in this light, the product story lands before the branding does.",
  "A soft confidence from Santa turns the Venus setup into something less like a demo.",
  "The afternoon at Tops feels unhurried, which is rare for a booth drop and suits Santa.",
  "Gillette Venus chose a face that does not compete with the finish, and that choice shows.",
  "Santa beside Venus gives the stop a center without making the product disappear.",
  "There is a clean warmth in how Santa shows up here. No loud pose, no forced gloss.",
  "This collab lets both names stay in the same temperature. That is harder than it looks.",
  "The booth breathes, so the finish can actually be read instead of guessed.",
  "Santa makes Pinklao feel closer. Gillette Venus makes the reason for stopping obvious.",
  "Soft retail light, a calm face, and a result that does not shout. That is the whole frame.",
  "Venus looks careful here, and Santa is the reason the care does not feel cold.",
  "The afternoon slot at Tops of Beauty has a specific pace, and Santa matches it.",
  "What holds this is not a slogan. It is Santa standing still long enough for the finish to register.",
  "Pinklao plus this Venus story has a real setting, not a blank backdrop.",
  "Santa does not force the mood, and that restraint is the appeal of the stop.",
  "The collab feels measured. Face and formula share the shot instead of trading it.",
  "A grooming drop usually rushes. This one with Santa slows down just enough to notice.",
  "Tops of Beauty looks clearer once Santa and Gillette Venus are in the same frame.",
  "The first thing that lands is the calm, then the smoothness, then the fact that both feel intentional.",
  "Santa keeps this afternoon frame soft. Venus keeps it precise. The mix works."
];
const middles = [
  "The finish looks smooth and easy to believe, closer to care than to a filter.",
  "A clean result is doing the convincing. The product does not need a louder claim.",
  "Gillette Venus shows the outcome without covering Santa, which is why the still feels honest.",
  "The smoothness reads as a real finish, not a grade. That is the line most booth shots miss.",
  "Nothing about the moment looks overworked, and that restraint matches the face.",
  "You can see the booth, the light, and the result in one glance, and none of them fight.",
  "It stays polished while still looking close to skin, which is the harder version of this ad.",
  "The Pinklao setting gives the drop a room, so the detail has somewhere to land.",
  "Pace matters here. Slow enough to remember the finish, not so slow that it turns stiff.",
  "Both sides stay visible. Santa is not decoration, and Venus is not a logo in the corner."
];
const closers = [
  "Curious if the next city keeps this same quiet pace, or if they let the booth get louder.",
  "Would you rather they stay in this Tops light, or take the pairing somewhere less retail?",
  "If there is a second chapter, the interest is already in the tone, not in a bigger setup.",
  "Do you think the location is doing as much work as the casting here?",
  "Hoping Pinklao is not the last time these names share a frame this calm.",
  "A continuation would feel earned if they keep the finish this close and believable.",
  "What did you notice first, the face or the result?",
  "That balance is usually what keeps a comment section open longer than a quick like."
];
const pool = [];
openings.forEach(o => {
  middles.forEach(m => {
    closers.forEach(c => pool.push(o + " " + m + " " + c));
  });
});
let order = pool.map((_, i) => i);
let cursor = 0;
let copied = 0;
let current = "";
const countEl = document.getElementById("count");
const poolEl = document.getElementById("pool");
const preview = document.getElementById("preview");
const postBtn = document.getElementById("post");
const toast = document.getElementById("toast");
poolEl.textContent = "Pool: " + pool.length + " comments";
function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = list[i];
    list[i] = list[j];
    list[j] = tmp;
  }
}
shuffle(order);
function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 1400);
}
function build(body) {
  return body + "\n\nSANTA WITH VENUS AT TOPS\n\n#GilletteVenusxSanta\n#Santapp";
}
async function generate() {
  if (cursor >= order.length) {
    shuffle(order);
    cursor = 0;
  }
  current = build(pool[order[cursor++]]);
  preview.textContent = current;
  preview.classList.remove("empty");
  postBtn.disabled = false;
  try {
    await navigator.clipboard.writeText(current);
    copied += 1;
    countEl.textContent = "Copied: " + copied + " comments";
    showToast("Copied");
  } catch (err) {
    showToast("Copy failed. Select the text manually.");
  }
}
document.getElementById("generate").addEventListener("click", generate);
postBtn.addEventListener("click", () => {
  if (!current) return;
  window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(current), "_blank", "noopener");
});
document.addEventListener("keydown", (event) => {
  if (event.code !== "Space") return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  event.preventDefault();
  generate();
});
</script>
</body>
</html>
