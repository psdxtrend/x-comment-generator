<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Comment Generator · Perth x L'Oréal Advanced Hair Care</title>
<style>
  :root {
    --bg: #f2f6f6;
    --paper: #fffdfb;
    --ink: #1e2a2c;
    --muted: #6a7678;
    --line: #d7e3e4;
    --clinic: #2c5d66;
    --clinic-dark: #234a52;
    --gold: #b7a08a;
    --chip: #e8f0f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 18px 56px; }
  h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
  .sub { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
  .notice {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--chip);
    border-left: 3px solid var(--gold);
    color: #3d4a4c;
    font-size: 14px;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin: 22px 0 16px;
    font-size: 15px;
  }
  .count { font-weight: 600; }
  .pool { color: var(--muted); }
  .preview {
    min-height: 220px;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 16px;
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 15px;
  }
  .preview.empty { color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  button {
    appearance: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    padding: 6px 10px;
    min-height: 32px;
  }
  .primary { background: var(--clinic); color: #fff; }
  .primary:hover { background: var(--clinic-dark); }
  .secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  .secondary:hover { background: #e5eeee; }
  .secondary:disabled { opacity: 0.45; cursor: not-allowed; }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    border: 0;
    background: transparent;
    color: var(--ink);
    padding: 0;
    min-height: 32px;
    cursor: pointer;
  }
  .switch {
    width: 36px;
    height: 20px;
    border-radius: 999px;
    background: #c9d5d6;
    position: relative;
    flex: 0 0 auto;
    transition: background 0.2s ease;
  }
  .switch i {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s ease;
  }
  .toggle.on .switch { background: var(--clinic); }
  .toggle.on .switch i { transform: translateX(16px); }
  .toggle span { font-size: 13px; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: #fff;
    padding: 10px 14px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>X Comment Generator</h1>
      <p class="sub">Perth · L’Oréal Paris · Advanced Hair Care Routine · Shopee Live</p>
      <div class="notice">Press Generate &amp; Copy to get comment. Trend starts 11:45 BKK. Do not use keyword or hashtag before then.</div>
    </header>
    <div class="stats">
      <div class="count" id="count">Copied: 0 comments</div>
      <div class="pool" id="pool"></div>
    </div>
    <div class="preview empty" id="preview">Your comment will appear here.</div>
    <div class="actions">
      <button class="primary" id="generate" type="button">Generate &amp; Copy</button>
      <button class="secondary" id="post" type="button" disabled>Post X</button>
      <button class="toggle" id="extra" type="button" aria-pressed="false">
        <span class="switch"><i></i></span>
        <span id="extraLabel">Off: keyword + main hashtag</span>
      </button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
const LIMIT = 280;

const openings = [
  "Perth goes live on Shopee and the whole chat lights up instantly.",
  "The second Perth starts the Advanced Hair Care Routine, fans flood in.",
  "L’Oréal Shopee live just got 10 times more exciting with Perth here.",
  "Perth appears on screen and every fan starts screaming in the chat.",
  "Waiting for Perth’s live feels forever but the energy is already crazy.",
  "Perth joins the live and the haircare vibe suddenly becomes premium.",
  "The moment Perth says hello, the Shopee live turns into a party.",
  "Fans are already ready the second Perth’s face shows up.",
  "Perth is live and the Advanced Hair Care Routine just leveled up.",
  "Can’t stop refreshing because Perth is finally on Shopee live.",
  "Perth’s presence makes this L’Oréal live feel so special.",
  "The chat is exploding the moment Perth starts talking.",
  "Perth walks into the live and everything suddenly looks better.",
  "Little devils are so loud right now because Perth is here.",
  "Perth’s live energy hits different every single time.",
  "From the first second, Perth owns this Shopee live completely.",
  "Fans have been waiting and Perth did not disappoint.",
  "Perth’s smile on screen already made this live unforgettable.",
  "The Advanced Hair Care Routine with Perth is pure excitement.",
  "Perth is here and the whole L’Oréal live feels brighter.",
  "Seeing Perth promote haircare like this just feels right.",
  "Perth starts the live and the hype never drops.",
  "Every fan is glued to the screen the second Perth appears.",
  "Perth makes this Shopee live feel like a special event.",
  "The energy jumps the moment Perth says “hi everyone”.",
  "Perth’s live just started and the chat is already wild.",
  "Proud of our boy the second he shows up for L’Oréal.",
  "Perth looks so good and the live energy is unmatched.",
  "Fans are living for this Advanced Hair Care moment with Perth.",
  "Perth turns a product live into pure happiness."
];

const middles = [
  "That sharp black suit and clean white shirt look so elegant today.",
  "The black outfit sits perfectly on him — pure visual perfection.",
  "Perth’s hair looks so healthy and shiny under the lights.",
  "He explains the Glycolic Gloss routine and still looks this cool.",
  "Full Resist + Glycolic Gloss Pro really suit the advanced care vibe.",
  "The way he talks about haircare feels natural and trustworthy.",
  "Outfit, posture, and smile are all on point for this live.",
  "Perth makes the product demo look effortless and fun.",
  "That black suit with the tie is giving serious premium energy.",
  "Fans keep praising how good his hair and outfit look together.",
  "He shows the products and the chat goes crazy for both him and the brand.",
  "Perth’s soft smile while introducing the routine is deadly.",
  "The glossy hair result he talks about matches his own look perfectly.",
  "He interacts with fans while looking so sharp in black.",
  "L’Oréal chose so well — Perth makes haircare feel premium.",
  "The Full Resist set for strength and Glycolic Gloss for shine is perfect pairing.",
  "Perth looks comfortable and glowing while teaching the routine.",
  "Every angle of that black suit hits different on camera.",
  "He holds the products and still steals the whole frame.",
  "The way he describes the advanced routine makes everyone want to try.",
  "Perth’s energy lifts both the brand and the fans at the same time.",
  "That clean black look is pure class for a haircare live.",
  "He laughs, talks, and the whole live stays locked on him.",
  "Seeing Perth recommend Glycolic Gloss feels so genuine.",
  "Outfit details plus healthy hair = absolute win today.",
  "Perth makes the Advanced Hair Care Routine look stylish.",
  "Fans are loving both the product tips and how handsome he is.",
  "The black suit frames him perfectly without trying too hard.",
  "He stays playful while still giving real haircare value.",
  "Perth and L’Oréal just click so naturally on this live."
];

const closers = [
  "Today Perth shines for L’Oréal again.",
  "This live already feels like a favorite memory.",
  "Proud of our boy every time he does these jobs.",
  "Fans are so happy seeing Perth with this brand.",
  "The Advanced Hair Care Routine just got its best host.",
  "He leaves the live the same way he arrived: full of charm.",
  "L’Oréal plus Perth is always a win.",
  "Counting every second of this beautiful live.",
  "Perth turns a product live into pure joy.",
  "Another day where he quietly steals everything.",
  "The chat will remember this energy for a long time.",
  "He makes haircare look this cool without even trying.",
  "Lucky fans who caught the live from the start.",
  "Perth’s smile at the end is already the highlight.",
  "This job fits him so well.",
  "The whole live feels better just because Perth is here.",
  "Fans leave the live with the same smile he gave them.",
  "Perth owns the afternoon without forcing anything.",
  "Can’t wait to see more of this glowing version of him.",
  "Proud to support Perth and L’Oréal together.",
  "He makes every product moment feel special.",
  "The energy stays high long after the live ends.",
  "Perth and advanced haircare is a perfect match.",
  "Another beautiful stage for our boy today.",
  "Live viewers got exactly the happiness they came for.",
  "Perth keeps the spark and the brand keeps the shine.",
  "This is the Shopee live everyone will talk about.",
  "He just makes everything look effortless.",
  "Fans are so proud watching him shine again.",
  "Thank you Perth for this lovely haircare moment."
];

const pool = [];
openings.forEach(o => {
  middles.forEach(m => {
    closers.forEach(c => pool.push(o + " " + m + " " + c));
  });
});

let order = pool.map((_, i) => i);
let cursor = 0;
let copied = 0;
let current = "";
let lastBody = "";
let extraOn = false;

const countEl = document.getElementById("count");
const poolEl = document.getElementById("pool");
const preview = document.getElementById("preview");
const postBtn = document.getElementById("post");
const toast = document.getElementById("toast");
const extraBtn = document.getElementById("extra");
const extraLabel = document.getElementById("extraLabel");

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
}
shuffle(order);

function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 1400);
}

function suffix() {
  const tags = extraOn
    ? "#LOrealParisHairxPerth\n#PerthTanapon"
    : "#LOrealParisHairxPerth";
  return "\n\nPERTH HAIR CARE ROUTINE\n\n" + tags;
}

function build(body) {
  return body + suffix();
}

function refreshExtra() {
  extraBtn.classList.toggle("on", extraOn);
  extraBtn.setAttribute("aria-pressed", extraOn ? "true" : "false");
  extraLabel.textContent = extraOn
    ? "On: + #PerthTanapon"
    : "Off: keyword + main hashtag";
  if (!lastBody) return;
  current = build(lastBody);
  if (current.length > LIMIT) {
    lastBody = "";
    current = "";
    preview.textContent = "Your comment will appear here.";
    preview.classList.add("empty");
    postBtn.disabled = true;
    return;
  }
  preview.textContent = current;
  preview.classList.remove("empty");
}

async function generate() {
  const tail = suffix();
  const room = LIMIT - tail.length;
  let body = "";
  for (let n = 0; n < pool.length; n++) {
    if (cursor >= order.length) {
      shuffle(order);
      cursor = 0;
    }
    const next = pool[order[cursor++]];
    if (next.length <= room) {
      body = next;
      break;
    }
  }
  if (!body) {
    showToast("No comment fits.");
    return;
  }
  lastBody = body;
  current = build(body);
  preview.textContent = current;
  preview.classList.remove("empty");
  postBtn.disabled = false;
  try {
    await navigator.clipboard.writeText(current);
    copied += 1;
    countEl.textContent = "Copied: " + copied + " comments";
    showToast("Copied");
  } catch (err) {
    showToast("Copy failed. Select the text manually.");
  }
}

poolEl.textContent = "Pool: " + pool.length + " comments";
document.getElementById("generate").addEventListener("click", generate);
extraBtn.addEventListener("click", () => {
  extraOn = !extraOn;
  refreshExtra();
});
postBtn.addEventListener("click", () => {
  if (!current || current.length > LIMIT) return;
  window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(current), "_blank", "noopener");
});
document.addEventListener("keydown", (event) => {
  if (event.code !== "Space") return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON") return;
  event.preventDefault();
  generate();
});
</script>
</body>
</html>
