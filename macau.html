<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Comment Generator · PerthSanta Fanmeeting Macau</title>
<style>
  :root {
    --bg: #f6f1ec;
    --paper: #fffdfb;
    --ink: #2a2428;
    --muted: #6f6569;
    --line: #e5dcd6;
    --accent: #b83b4a;
    --accent-dark: #9a2f3c;
    --gold: #b7a08a;
    --chip: #f3ebe6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 18px 56px; }
  h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
  .sub { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
  .notice {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--chip);
    border-left: 3px solid var(--gold);
    color: #4e4246;
    font-size: 14px;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin: 22px 0 16px;
    font-size: 15px;
  }
  .count { font-weight: 600; }
  .pool { color: var(--muted); }
  .preview {
    min-height: 220px;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 16px;
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 15px;
  }
  .preview.empty { color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  button {
    appearance: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    padding: 6px 10px;
    min-height: 32px;
  }
  .primary { background: var(--accent); color: #fff; }
  .primary:hover { background: var(--accent-dark); }
  .secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  .secondary:hover { background: #f3e8eb; }
  .secondary:disabled { opacity: 0.45; cursor: not-allowed; }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    border: 0;
    background: transparent;
    color: var(--ink);
    padding: 0;
    min-height: 32px;
    cursor: pointer;
  }
  .switch {
    width: 36px;
    height: 20px;
    border-radius: 999px;
    background: #e0d0d6;
    position: relative;
    flex: 0 0 auto;
    transition: background 0.2s ease;
  }
  .switch i {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s ease;
  }
  .toggle.on .switch { background: var(--accent); }
  .toggle.on .switch i { transform: translateX(16px); }
  .toggle span { font-size: 13px; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: #fff;
    padding: 10px 14px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>X Comment Generator</h1>
      <p class="sub">PERTHSANTA 1ST FANMEETING IN MACAU</p>
      <div class="notice">Press Generate & Copy to get comment. Trend starts 12:00 (GMT+7). Do not use keyword or hashtag before then.</div>
    </header>
    <div class="stats">
      <div class="count" id="count">Copied: 0 comments</div>
      <div class="pool" id="pool"></div>
    </div>
    <div class="preview empty" id="preview">Your comment will appear here.</div>
    <div class="actions">
      <button class="primary" id="generate" type="button">Generate & Copy</button>
      <button class="secondary" id="post" type="button" disabled>Post X</button>
      <button class="toggle" id="extra" type="button" aria-pressed="false">
        <span class="switch"><i></i></span>
        <span id="extraLabel">Off: keyword + main hashtag</span>
      </button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
const LIMIT = 280;

const openings = [
  "Finally seeing PerthSanta live in Macau feels unreal.",
  "The first fanmeeting at Lisboeta already looks perfect.",
  "H853 Hall is glowing because PerthSanta are here.",
  "Macau fans are so lucky to get this first duo show.",
  "Perth looks so handsome under the stage lights today.",
  "Santa’s smile is brighter than every light in the hall.",
  "The chemistry between Perth and Santa is crazy good live.",
  "Can’t believe this is their very first fanmeeting together.",
  "Everyone in the venue is screaming the second they appear.",
  "The stage at Lisboeta suits PerthSanta so well.",
  "Perth’s calm aura + Santa’s bright energy = perfect balance.",
  "This afternoon at H853 already feels like a dream.",
  "Fans traveled all the way just for this PerthSanta moment.",
  "The duo look even better in person than on screen.",
  "Macau is lucky to host the first PerthSanta fanmeeting.",
  "Santa keeps waving and the whole hall melts.",
  "Perth’s eyes when he looks at Santa are everything.",
  "The atmosphere inside H853 is pure love right now.",
  "First FM and they already own the entire stage.",
  "Lisboeta Macau just became PerthSanta’s new home.",
  "Seeing them stand side by side for the first time is special.",
  "The energy from the crowd is insane for this first show.",
  "PerthSanta walking out together is the best moment of the day.",
  "Everyone can feel how happy they are to meet fans here.",
  "This fanmeeting is starting stronger than anyone expected."
];

const middles = [
  "Their performances are so clean and full of feeling.",
  "The program is packed with cute and funny segments.",
  "Every interaction between them feels natural and sweet.",
  "Santa’s voice and Perth’s presence make the songs hit harder.",
  "The talk segments are hilarious because of their chemistry.",
  "Fans can clearly see how much they care about each other.",
  "The stage production matches the Lost in Love theme perfectly.",
  "They keep giving more and more during every part of the show.",
  "Perth’s gentle side and Santa’s playful side balance so well.",
  "The whole hall keeps cheering nonstop for both of them.",
  "Every song and game segment feels carefully prepared.",
  "Their eye contact during performances is so soft and real.",
  "Santa lights up every time Perth does something small.",
  "The duo make even simple moments feel special.",
  "Fans are getting exactly the warm vibe they hoped for.",
  "The surprises in the program keep making everyone scream.",
  "Perth and Santa look so comfortable performing together.",
  "The energy never drops because they keep connecting with the crowd.",
  "Their chemistry on stage is even stronger than expected.",
  "Every part of the show shows how hard they prepared."
];

const closers = [
  "Hope the whole event goes smoothly till the end.",
  "Wishing PerthSanta a successful first fanmeeting.",
  "Can’t wait for them to come back to Macau again.",
  "Please return to Macau soon, we already miss them.",
  "This show is so good, we need a second one here.",
  "Hope everything runs perfectly for Perth and Santa today.",
  "Macau fans will be waiting for the next visit.",
  "The program is amazing, please do more shows like this.",
  "Wishing them a safe and happy afternoon in Macau.",
  "Already hoping they return to Lisboeta next year.",
  "This first FM is perfect, come back soon please.",
  "Hope the event ends as beautifully as it started.",
  "We will be here when they come back to Macau.",
  "Such a well-prepared show, thank you PerthSanta.",
  "Looking forward to the next Macau fanmeeting already.",
  "Wish them smooth performances and happy fans all day.",
  "Macau loves them, please come back again.",
  "The program is so fun, hope they tour more places after this.",
  "Thank you for giving us this first beautiful meeting.",
  "Hope every moment today goes exactly as planned."
];

const pool = [];
openings.forEach(o => {
  middles.forEach(m => {
    closers.forEach(c => pool.push(o + " " + m + " " + c));
  });
});

let order = pool.map((_, i) => i);
let cursor = 0;
let copied = 0;
let current = "";
let lastBody = "";
let extraOn = false;

const countEl = document.getElementById("count");
const poolEl = document.getElementById("pool");
const preview = document.getElementById("preview");
const postBtn = document.getElementById("post");
const toast = document.getElementById("toast");
const extraBtn = document.getElementById("extra");
const extraLabel = document.getElementById("extraLabel");

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
}

shuffle(order);

function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 1400);
}

function suffix() {
  const tags = extraOn
    ? "#PerthSantaFMinMacau\n#PerthSanta #เพิร์ธแซนต้า"
    : "#PerthSantaFMinMacau";
  return "\n\nPERTHSANTA LOST IN LOVE\n\n" + tags;
}

function build(body) {
  return body + suffix();
}

function refreshExtra() {
  extraBtn.classList.toggle("on", extraOn);
  extraBtn.setAttribute("aria-pressed", extraOn ? "true" : "false");
  extraLabel.textContent = extraOn
    ? "On: + #PerthSanta #PerthTanapon #Santapp"
    : "Off: keyword + main hashtag";
  if (!lastBody) return;
  current = build(lastBody);
  if (current.length > LIMIT) {
    lastBody = "";
    current = "";
    preview.textContent = "Your comment will appear here.";
    preview.classList.add("empty");
    postBtn.disabled = true;
    return;
  }
  preview.textContent = current;
  preview.classList.remove("empty");
}

async function generate() {
  const tail = suffix();
  const room = LIMIT - tail.length;
  let body = "";
  for (let n = 0; n < pool.length; n++) {
    if (cursor >= order.length) {
      shuffle(order);
      cursor = 0;
    }
    const next = pool[order[cursor++]];
    if (next.length <= room) {
      body = next;
      break;
    }
  }
  if (!body) {
    showToast("No comment fits.");
    return;
  }
  lastBody = body;
  current = build(body);
  preview.textContent = current;
  preview.classList.remove("empty");
  postBtn.disabled = false;
  try {
    await navigator.clipboard.writeText(current);
    copied += 1;
    countEl.textContent = "Copied: " + copied + " comments";
    showToast("Copied");
  } catch (err) {
    showToast("Copy failed. Select the text manually.");
  }
}

poolEl.textContent = "Pool: " + pool.length + " comments";
document.getElementById("generate").addEventListener("click", generate);
extraBtn.addEventListener("click", () => {
  extraOn = !extraOn;
  refreshExtra();
});
postBtn.addEventListener("click", () => {
  if (!current || current.length > LIMIT) return;
  window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(current), "_blank", "noopener");
});
document.addEventListener("keydown", (event) => {
  if (event.code !== "Space") return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON") return;
  event.preventDefault();
  generate();
});
</script>
</body>
</html>
