<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Comment Generator · Infinity x Perth</title>
<style>
  :root {
    --bg: #f2f6f6;
    --paper: #fffdfb;
    --ink: #1e2a2c;
    --muted: #6a7678;
    --line: #d7e3e4;
    --clinic: #2c5d66;
    --clinic-dark: #234a52;
    --gold: #b7a08a;
    --chip: #e8f0f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 18px 56px; }
  h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
  .sub { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
  .notice {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--chip);
    border-left: 3px solid var(--gold);
    color: #3d4a4c;
    font-size: 14px;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin: 22px 0 16px;
    font-size: 15px;
  }
  .count { font-weight: 600; }
  .pool { color: var(--muted); }
  .preview {
    min-height: 220px;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 16px;
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 15px;
  }
  .preview.empty { color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  button {
    appearance: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    padding: 6px 10px;
    min-height: 32px;
  }
  .primary { background: var(--clinic); color: #fff; flex: 0 0 auto; }
  .primary:hover { background: var(--clinic-dark); }
  .secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
    flex: 0 0 auto;
  }
  .secondary:hover { background: #e5eeee; }
  .secondary:disabled { opacity: 0.45; cursor: not-allowed; }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    border: 0;
    background: transparent;
    color: var(--ink);
    padding: 0;
    min-height: 32px;
    cursor: pointer;
  }
  .switch {
    width: 36px;
    height: 20px;
    border-radius: 999px;
    background: #c9d5d6;
    position: relative;
    flex: 0 0 auto;
    transition: background 0.2s ease;
  }
  .switch i {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s ease;
  }
  .toggle.on .switch { background: var(--clinic); }
  .toggle.on .switch i { transform: translateX(16px); }
  .toggle span { font-size: 13px; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: #fff;
    padding: 10px 14px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>X Comment Generator</h1>
      <p class="sub">Job: Perth x Infinity Medical Clinic</p>
      <div class="notice">Press Space to Generate and Copy. Trend start 16:45. Do not use the keyword or hashtag before then. Limit 280 with keyword and both hashtags.</div>
    </header>
    <div class="stats">
      <div class="count" id="count">Copied: 0 comments</div>
      <div class="pool" id="pool"></div>
    </div>
    <div class="preview empty" id="preview">Your comment will appear here.</div>
    <div class="actions">
      <button class="primary" id="generate" type="button">Generate &amp; Copy</button>
      <button class="secondary" id="post" type="button" disabled>Post X</button>
      <button class="toggle" id="extra" type="button" aria-pressed="false">
        <span class="switch"><i></i></span>
        <span id="extraLabel">Off: keyword + main hashtag</span>
      </button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script>
const LIMIT = 280;
const openings = [
  "Perth looks at ease with Infinity Medical Clinic on the G Floor.",
  "The Infinity booth gives Perth room at Central Chanthaburi.",
  "Perth with Infinity feels like a care stop, not a staged reveal.",
  "Infinity keeps the booth open, and Perth uses that floor well.",
  "On the G Floor, Perth lets the clinic setting stay visible.",
  "The pairing is quiet: Perth at Infinity, skin still his own.",
  "Perth keeps the Chanthaburi frame close enough to check.",
  "Infinity and Perth share the floor without crowding it.",
  "Perth beside Infinity gives the activity area a still center.",
  "The booth slows when Perth stands with the clinic team.",
  "Face and care stay in one register. Perth does not outshine it.",
  "Perth at the Infinity booth looks like he came for a visit.",
  "Clinic light at Central Chanthaburi is plain, and his skin reads.",
  "Infinity chose a face that leaves the result visible.",
  "Soft afternoon on the G Floor, Perth unhurried, finish readable.",
  "Perth makes the Infinity stop feel closer than a mall activation.",
  "The activity area is simple, and Perth uses that plainness well.",
  "Perth and Infinity stay calm, with no extra glow forced on.",
  "This Infinity stop with Perth feels like a real clinic hour.",
  "Perth holds the moment the way someone would before a consult.",
  "Infinity next to Perth has a clean rhythm: face, then result.",
  "The G Floor leaves air around Perth, so the work can be seen.",
  "Perth does not push the mood. Infinity does the visible work.",
  "First Perth's calm, then skin that looks kept, not corrected.",
  "Perth keeps the stop soft. Infinity Medical Clinic keeps it specific."
];
const middles = [
  "The skin looks kept, not filtered into another face.",
  "The result reads at the cheek, and it is still his.",
  "Infinity shows the outcome without covering Perth.",
  "The finish stays believable in mall light.",
  "Nothing looks overworked. The care sits and stays.",
  "Booth, light and skin share one glance.",
  "The evenness is easy to see, and it still looks real.",
  "Central Chanthaburi gives the detail room to land.",
  "The face looks rested, not painted for a still.",
  "Both the person and the clinic result stay visible."
];
const closers = [
  "This G Floor meet already reads as a real Infinity visit.",
  "Perth and Infinity make the Chanthaburi stop feel steady.",
  "The result stays visible, and the journey stays easy to follow.",
  "Infinity fits Perth because the finish looks kept, not rebuilt.",
  "The booth, the artist and the skin sit in one calm register.",
  "Today's stop leaves the face and the outcome in one frame.",
  "Perth carries the hour without hiding the clinic work.",
  "Chanthaburi and Perth turn this Infinity visit into a clean moment."
];

const pool = [];
openings.forEach(o => {
  middles.forEach(m => {
    closers.forEach(c => pool.push(o + " " + m + " " + c));
  });
});

let order = pool.map((_, i) => i);
let cursor = 0;
let copied = 0;
let current = "";
let lastBody = "";
let extraOn = false;

const countEl = document.getElementById("count");
const poolEl = document.getElementById("pool");
const preview = document.getElementById("preview");
const postBtn = document.getElementById("post");
const toast = document.getElementById("toast");
const extraBtn = document.getElementById("extra");
const extraLabel = document.getElementById("extraLabel");

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = list[i];
    list[i] = list[j];
    list[j] = tmp;
  }
}

shuffle(order);

function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 1400);
}

function suffix() {
  const tags = extraOn
    ? "#InfinitymedicalclinicxPerth\n#PerthTanapon"
    : "#InfinitymedicalclinicxPerth";
  return "\n\nPERTH JOURNEY INFINITY LOVE\n\n" + tags;
}

function build(body) {
  return body + suffix();
}

function refreshExtra() {
  extraBtn.classList.toggle("on", extraOn);
  extraBtn.setAttribute("aria-pressed", extraOn ? "true" : "false");
  extraLabel.textContent = extraOn
    ? "On: + #PerthTanapon"
    : "Off: keyword + main hashtag";
  if (!lastBody) return;
  current = build(lastBody);
  if (current.length > LIMIT) {
    lastBody = "";
    current = "";
    preview.textContent = "Your comment will appear here.";
    preview.classList.add("empty");
    postBtn.disabled = true;
    return;
  }
  preview.textContent = current;
  preview.classList.remove("empty");
  countEl.textContent = "Copied: " + copied + " comments · " + current.length + "/" + LIMIT;
}

async function generate() {
  const tail = suffix();
  const room = LIMIT - tail.length;
  let body = "";
  for (let n = 0; n < pool.length; n++) {
    if (cursor >= order.length) {
      shuffle(order);
      cursor = 0;
    }
    const next = pool[order[cursor++]];
    if (next.length <= room) {
      body = next;
      break;
    }
  }
  if (!body) {
    showToast("No comment fits " + LIMIT + ".");
    return;
  }
  lastBody = body;
  current = build(body);
  preview.textContent = current;
  preview.classList.remove("empty");
  postBtn.disabled = false;
  try {
    await navigator.clipboard.writeText(current);
    copied += 1;
    countEl.textContent = "Copied: " + copied + " comments · " + current.length + "/" + LIMIT;
    showToast("Copied " + current.length + "/" + LIMIT);
  } catch (err) {
    showToast("Copy failed. Select the text manually.");
  }
}

poolEl.textContent = "Pool: " + pool.length + " comments · max 264/280 with both hashtags";
document.getElementById("generate").addEventListener("click", generate);
extraBtn.addEventListener("click", () => {
  extraOn = !extraOn;
  refreshExtra();
});
postBtn.addEventListener("click", () => {
  if (!current || current.length > LIMIT) return;
  window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(current), "_blank", "noopener");
});
document.addEventListener("keydown", (event) => {
  if (event.code !== "Space") return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON") return;
  event.preventDefault();
  generate();
});
</script>
</body>
</html>
