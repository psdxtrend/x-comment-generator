<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Comment Generator · Domiia Maya Awards</title>
<style>
  :root {
    --bg: #f6f1ec; --paper: #fffdfb; --ink: #2a2428; --muted: #6f6569;
    --line: #e5dcd6; --accent: #b83b4a; --accent-dark: #9a2f3c;
    --gold: #b7a08a; --chip: #f3ebe6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 18px 56px; }
  h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
  .sub { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
  .notice { margin-top: 14px; padding: 10px 12px; background: var(--chip); border-left: 3px solid var(--gold); color: #4e4246; font-size: 14px; }
  .stats { display: flex; justify-content: space-between; gap: 12px; margin: 22px 0 16px; font-size: 15px; }
  .count { font-weight: 600; } .pool { color: var(--muted); }
  .preview { min-height: 220px; background: var(--paper); border: 1px solid var(--line); padding: 16px; white-space: pre-wrap; line-height: 1.55; font-size: 15px; }
  .preview.empty { color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  button { appearance: none; border: 0; cursor: pointer; font: inherit; font-size: 13px; padding: 6px 10px; min-height: 32px; }
  .primary { background: var(--accent); color: #fff; } .primary:hover { background: var(--accent-dark); }
  .secondary { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .secondary:hover { background: #f3e8eb; } .secondary:disabled { opacity: 0.45; cursor: not-allowed; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; border: 0; background: transparent; color: var(--ink); padding: 0; min-height: 32px; cursor: pointer; }
  .switch { width: 36px; height: 20px; border-radius: 999px; background: #e0d0d6; position: relative; flex: 0 0 auto; transition: background 0.2s ease; }
  .switch i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 0.2s ease; }
  .toggle.on .switch { background: var(--accent); } .toggle.on .switch i { transform: translateX(16px); }
  .toggle span { font-size: 13px; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(12px); background: var(--ink); color: #fff; padding: 10px 14px; font-size: 14px; opacity: 0; pointer-events: none; transition: 0.2s ease; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>X Comment Generator</h1>
      <p class="sub">Domiia · MAYA TV Awards 2026</p>
      <div class="notice">Press Generate & Copy. Trend starts 17:00 BKK. Do not use keyword/hashtag before then.</div>
    </header>
    <div class="stats">
      <div class="count" id="count">Copied: 0 comments</div>
      <div class="pool" id="pool"></div>
    </div>
    <div class="preview empty" id="preview">Your comment will appear here.</div>
    <div class="actions">
      <button class="primary" id="generate" type="button">Generate & Copy</button>
      <button class="secondary" id="post" type="button" disabled>Post X</button>
      <button class="toggle" id="extra" type="button" aria-pressed="false">
        <span class="switch"><i></i></span>
        <span id="extraLabel">Off: keyword + main hashtag</span>
      </button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
const LIMIT = 280;

const openings = [
  "MCC Hall lights up the second Domiia steps on the red carpet.",
  "Domiia’s horns catch every flash at Maya TV Awards.",
  "The little devil walks into The Mall Lifestore and owns the carpet.",
  "Red carpet at MCC Hall gets brighter the moment Domiia appears.",
  "Fans spot the red hair and horns before anything else.",
  "Domiia tilts his head and the whole section cheers.",
  "Maya Awards 2026 has a clear highlight when Domiia arrives.",
  "The hall quiets then erupts the second Domiia walks in.",
  "Domiia moves freely across the carpet, energy never drops.",
  "Little Devils already know this night belongs to Domiia.",
  "Live stream cameras keep locking onto Domiia no matter the angle.",
  "The Mall Bangkapi fills with noise once Domiia shows up.",
  "Domiia’s wings open and close under the award lights.",
  "Awards night energy jumps the second Domiia enters the frame.",
  "Fans on the live start typing the moment Domiia’s horns appear.",
  "Domiia steps onto the red carpet and the atmosphere shifts.",
  "Every light at MCC Hall finds Domiia instantly.",
  "The little devil peeks into frame and steals the shot.",
  "Domiia walks the carpet like he already knows it’s his night.",
  "Maya TV Awards gets a full dose of devil energy when he arrives."
];

const middles = [
  "Nothing feels forced. Domiia just does his thing.",
  "He stays in the lights and still steals every glance.",
  "The black-and-red look matches the award energy perfectly.",
  "Fans catch his restless steps and the grin that follows.",
  "He pouts for a second then beams at the crowd again.",
  "The red carpet becomes Domiia’s personal stage tonight.",
  "Lights hit his horns just right in every single shot.",
  "He adds movement while the carpet stays still.",
  "The devil energy stays light, fun, and full of personality.",
  "Cameras keep finding him even when he tries to step back.",
  "He checks the lights then spins back toward the front.",
  "The atmosphere lifts the second he steps into frame.",
  "His energy bounces off the stage and into the live comments.",
  "He waves, pretends to be shy, then waves again.",
  "Fans on YouTube and Facebook keep typing his name nonstop.",
  "He matches the red carpet pace then breaks it with a spin.",
  "Domiia’s presence makes the whole awards night feel alive.",
  "He stays fully in character the entire time and it works."
];

const closers = [
  "Tonight Domiia dazzles at Maya.",
  "Little Devils get their devil on the big stage.",
  "He leaves the same way he arrived: full of energy.",
  "Maya TV Awards now has one clear Domiia moment.",
  "Fans leave with the same picture of the dazzling devil.",
  "The evening feels complete with him there.",
  "He turns a regular red carpet into his own mark.",
  "Domiia keeps the spark. The awards keep the lights.",
  "The hall holds the moment exactly as it is.",
  "This is the night the little devil shines brightest.",
  "Live viewers get exactly what they came for.",
  "He makes the red carpet unforgettable.",
  "The energy stays high long after he moves on.",
  "Domiia owns the carpet without saying a word.",
  "Fans already replaying the clips."
];

const pool = [];
openings.forEach(o => {
  middles.forEach(m => {
    closers.forEach(c => pool.push(o + " " + m + " " + c));
  });
});

let order = pool.map((_, i) => i);
let cursor = 0;
let copied = 0;
let current = "";
let lastBody = "";
let extraOn = false;

const countEl = document.getElementById("count");
const poolEl = document.getElementById("pool");
const preview = document.getElementById("preview");
const postBtn = document.getElementById("post");
const toast = document.getElementById("toast");
const extraBtn = document.getElementById("extra");
const extraLabel = document.getElementById("extraLabel");

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
}
shuffle(order);

function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 1400);
}

function suffix() {
  const tags = extraOn
    ? "#MAYATVAWARDS2026\n#DOMIIA"
    : "#MAYATVAWARDS2026";
  return "\n\nDOMIIA DAZZLES AT MAYA\n\n" + tags;
}

function build(body) { return body + suffix(); }

function refreshExtra() {
  extraBtn.classList.toggle("on", extraOn);
  extraBtn.setAttribute("aria-pressed", extraOn ? "true" : "false");
  extraLabel.textContent = extraOn ? "On: + #DOMIIA" : "Off: keyword + main hashtag";
  if (!lastBody) return;
  current = build(lastBody);
  if (current.length > LIMIT) {
    lastBody = ""; current = "";
    preview.textContent = "Your comment will appear here.";
    preview.classList.add("empty");
    postBtn.disabled = true;
    return;
  }
  preview.textContent = current;
  preview.classList.remove("empty");
}

async function generate() {
  const tail = suffix();
  const room = LIMIT - tail.length;
  let body = "";
  for (let n = 0; n < pool.length; n++) {
    if (cursor >= order.length) { shuffle(order); cursor = 0; }
    const next = pool[order[cursor++]];
    if (next.length <= room) { body = next; break; }
  }
  if (!body) { showToast("No comment fits."); return; }
  lastBody = body;
  current = build(body);
  preview.textContent = current;
  preview.classList.remove("empty");
  postBtn.disabled = false;
  try {
    await navigator.clipboard.writeText(current);
    copied += 1;
    countEl.textContent = "Copied: " + copied + " comments";
    showToast("Copied");
  } catch (err) {
    showToast("Copy failed. Select the text manually.");
  }
}

poolEl.textContent = "Pool: " + pool.length + " comments";
document.getElementById("generate").addEventListener("click", generate);
extraBtn.addEventListener("click", () => { extraOn = !extraOn; refreshExtra(); });
postBtn.addEventListener("click", () => {
  if (!current || current.length > LIMIT) return;
  window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(current), "_blank", "noopener");
});
document.addEventListener("keydown", (e) => {
  if (e.code !== "Space") return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON") return;
  e.preventDefault();
  generate();
});
</script>
</body>
</html>
