<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Comment Generator · Chupa Chups Sour Belt x PerthSanta</title>
<style>
  :root {
    --bg: #fff5f5;
    --paper: #fffdfb;
    --ink: #1e1a1a;
    --muted: #6b5e5e;
    --line: #f0dcdc;
    --accent: #e63946;
    --accent-dark: #c1121f;
    --gold: #ffb703;
    --chip: #fff0f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 18px 56px; }
  h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
  .sub { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
  .notice {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--chip);
    border-left: 3px solid var(--gold);
    color: #3d2f2f;
    font-size: 14px;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin: 22px 0 16px;
    font-size: 15px;
  }
  .count { font-weight: 600; }
  .pool { color: var(--muted); }
  .preview {
    min-height: 220px;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 16px;
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 15px;
  }
  .preview.empty { color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  button {
    appearance: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    padding: 6px 10px;
    min-height: 32px;
  }
  .primary { background: var(--accent); color: #fff; }
  .primary:hover { background: var(--accent-dark); }
  .secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  .secondary:hover { background: #fce8e8; }
  .secondary:disabled { opacity: 0.45; cursor: not-allowed; }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    border: 0;
    background: transparent;
    color: var(--ink);
    padding: 0;
    min-height: 32px;
    cursor: pointer;
  }
  .switch {
    width: 36px;
    height: 20px;
    border-radius: 999px;
    background: #d9c5c5;
    position: relative;
    flex: 0 0 auto;
    transition: background 0.2s ease;
  }
  .switch i {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s ease;
  }
  .toggle.on .switch { background: var(--accent); }
  .toggle.on .switch i { transform: translateX(16px); }
  .toggle span { font-size: 13px; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: #fff;
    padding: 10px 14px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>X Comment Generator</h1>
      <p class="sub">PerthSanta · Chupa Chups Sour Belt · TikTok Sino Family Shop</p>
      <div class="notice">
        Press Generate &amp; Copy to get comment.<br>
        Trend starts 18:45 BKK · Live at 19:00 BKK.<br>
        Do not use keyword or hashtag before 18:45.
      </div>
    </header>
    <div class="stats">
      <div class="count" id="count">Copied: 0 comments</div>
      <div class="pool" id="pool"></div>
    </div>
    <div class="preview empty" id="preview">Your comment will appear here.</div>
    <div class="actions">
      <button class="primary" id="generate" type="button">Generate &amp; Copy</button>
      <button class="secondary" id="post" type="button" disabled>Post X</button>
      <button class="toggle" id="extra" type="button" aria-pressed="false">
        <span class="switch"><i></i></span>
        <span id="extraLabel">Off: only 2 main hashtags</span>
      </button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
const LIMIT = 280;

const openings = [
  "The second PerthSanta appear, the whole Sino Family Shop live lights up.",
  "Chupa Chups Sour Belt with PerthSanta already has fans hyped.",
  "Two of them walk in and the energy completely changes.",
  "Sino Family Shop feels brighter tonight because of PerthSanta.",
  "Fans are counting down every second to see them with the Sour Belt.",
  "Chupa Chups picked the perfect pair — PerthSanta fit this concept so well.",
  "The live just started and the energy is already sky high with them.",
  "The moment they hold the Sour Belt, fans are already smiling.",
  "PerthSanta and Chupa Chups Sour Belt are creating a memorable night.",
  "Tonight’s TikTok live feels special because PerthSanta is here.",
  "Fans are so curious what the games will be like with them hosting.",
  "Chupa Chups Sour Belt x PerthSanta already looks so fun to join.",
  "They smile while holding the Sour Belt and the whole live brightens up.",
  "PerthSanta make the brand feel warm and approachable.",
  "Sino Family Shop + PerthSanta + Sour Belt = perfect combo.",
  "Everyone is wondering how fun the games will get with PerthSanta.",
  "The moment they appear, the chat starts screaming.",
  "Sour Belt looks even better in PerthSanta’s hands.",
  "Tonight’s live already feels warm because of them.",
  "PerthSanta and the brand are giving fans a night worth waiting for.",
  "PerthSanta just stepped in and the whole live energy shifted.",
  "Chupa Chups Sour Belt feels so much more exciting with them.",
  "Two of them together already make this live special.",
  "Fans can’t stop smiling seeing PerthSanta with the Sour Belt.",
  "The brand looks even better when PerthSanta is the one holding it."
];

const middles = [
  "They smile while holding the Sour Belt and it already looks so tempting.",
  "Outfit, vibe and the candy work so well together.",
  "PerthSanta make the product feel fun and close to fans.",
  "Everyone is excited to see how funny and fun the games will be.",
  "The way they interact with the brand feels so natural.",
  "Sour Belt in their hands makes you want to buy it immediately.",
  "Their energy makes the whole live feel alive.",
  "Chupa Chups choosing PerthSanta was the perfect decision.",
  "The moment they hold the candy and smile, fans smile with them.",
  "The games are going to be interesting for sure with them leading.",
  "Their soft + playful vibe matches the Sour Belt so well.",
  "PerthSanta make the brand feel even more lovable.",
  "Fans can’t wait to see how they will play the games.",
  "The way they introduce the product feels natural and fun.",
  "Sour Belt + PerthSanta already makes you want to join the live.",
  "They keep the energy high while still looking so soft.",
  "The candy looks completely different when held by PerthSanta.",
  "Everyone is curious how surprising the game segment will be.",
  "They make the entire live feel warm and close.",
  "The brand and PerthSanta are such a perfect match.",
  "Their chemistry with the product is so natural and fun.",
  "The way they talk about the Sour Belt feels genuine.",
  "Fans are loving how playful they are with the brand.",
  "Every little interaction makes the live more entertaining.",
  "They turn a simple product live into something really enjoyable."
];

const closers = [
  "So excited for the live and the games.",
  "PerthSanta + Chupa Chups is such a perfect match.",
  "Fans are already smiling along with them.",
  "This is definitely going to be a memorable live.",
  "Can’t wait to see how fun the games will be.",
  "PerthSanta make the brand shine even more.",
  "Sour Belt looks so good in their hands.",
  "The energy is so good, fans are loving it.",
  "Chupa Chups chose the right people.",
  "Tonight is going to be so much fun.",
  "Really looking forward to the game segment.",
  "They make the whole night feel joyful.",
  "Brand + PerthSanta = perfect combo.",
  "Sino Family Shop is worth watching tonight.",
  "Fans are so hyped for this live.",
  "PerthSanta always bring that soft and warm vibe.",
  "There will definitely be many memorable moments.",
  "Curious to see how they will play the games.",
  "Sour Belt + PerthSanta just works so well.",
  "So proud of them tonight.",
  "This collab already feels special.",
  "Fans are fully supporting this one.",
  "Another great night with PerthSanta.",
  "The hype is real for this live.",
  "Can’t wait to see more of them with the brand."
];

const pool = [];
openings.forEach(o => {
  middles.forEach(m => {
    closers.forEach(c => pool.push(o + " " + m + " " + c));
  });
});

let order = pool.map((_, i) => i);
let cursor = 0;
let copied = 0;
let current = "";
let lastBody = "";
let extraOn = false;

const countEl = document.getElementById("count");
const poolEl = document.getElementById("pool");
const preview = document.getElementById("preview");
const postBtn = document.getElementById("post");
const toast = document.getElementById("toast");
const extraBtn = document.getElementById("extra");
const extraLabel = document.getElementById("extraLabel");

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
}
shuffle(order);

function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 1400);
}

function suffix() {
  const mainTags = "#ChupachupssourbeltxPS\n#ChupachupsxPS";
  const extraTags = extraOn
    ? "\n#PerthSanta\n#เพิร์ธแซนต้า"
    : "";
  return "\n\nPERTHSANTA ENCHANTED CHUPS\n\n" + mainTags + extraTags;
}

function build(body) {
  return body + suffix();
}

function refreshExtra() {
  extraBtn.classList.toggle("on", extraOn);
  extraBtn.setAttribute("aria-pressed", extraOn ? "true" : "false");
  extraLabel.textContent = extraOn
    ? "On: + #PerthSanta #เพิร์ธแซนต้า"
    : "Off: only 2 main hashtags";
  if (!lastBody) return;
  current = build(lastBody);
  if (current.length > LIMIT) {
    lastBody = "";
    current = "";
    preview.textContent = "Your comment will appear here.";
    preview.classList.add("empty");
    postBtn.disabled = true;
    return;
  }
  preview.textContent = current;
  preview.classList.remove("empty");
}

async function generate() {
  const tail = suffix();
  const room = LIMIT - tail.length;
  let body = "";
  for (let n = 0; n < pool.length; n++) {
    if (cursor >= order.length) {
      shuffle(order);
      cursor = 0;
    }
    const next = pool[order[cursor++]];
    if (next.length <= room) {
      body = next;
      break;
    }
  }
  if (!body) {
    showToast("No comment fits.");
    return;
  }
  lastBody = body;
  current = build(body);
  preview.textContent = current;
  preview.classList.remove("empty");
  postBtn.disabled = false;
  try {
    await navigator.clipboard.writeText(current);
    copied += 1;
    countEl.textContent = "Copied: " + copied + " comments";
    showToast("Copied");
  } catch (err) {
    showToast("Copy failed. Select the text manually.");
  }
}

poolEl.textContent = "Pool: " + pool.length + " comments";
document.getElementById("generate").addEventListener("click", generate);
extraBtn.addEventListener("click", () => {
  extraOn = !extraOn;
  refreshExtra();
});
postBtn.addEventListener("click", () => {
  if (!current || current.length > LIMIT) return;
  window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(current), "_blank", "noopener");
});
document.addEventListener("keydown", (event) => {
  if (event.code !== "Space") return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON") return;
  event.preventDefault();
  generate();
});
</script>
</body>
</html>
