const langs = Object.keys(cores);
const themes = ["star", "collab", "product", "vibe", "future"];
const pool = [];
langs.forEach(lang => {
  themes.forEach(theme => {
    cores[lang][theme].forEach(line => {
      tails[lang].forEach(tail => pool.push(line + tail));
    });
  });
});
function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
}
let order = pool.map((_, i) => i);
let cursor = 0;
let copied = 0;
let current = "";
shuffle(order);
const preview = document.getElementById("preview");
const generateBtn = document.getElementById("generate");
const postBtn = document.getElementById("post");
const countEl = document.getElementById("count");
const poolEl = document.getElementById("pool");
const toast = document.getElementById("toast");
poolEl.textContent = pool.length + " comments in pool";
function build(body) {
  return body + "\nPERTH X TOPS OF GOHAIR\n\n#GOHAIRxPerth\n#PerthTanapon";
}
function showToast(message) {
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove("show"), 1400);
}
async function generate() {
  if (cursor >= order.length) {
    shuffle(order);
    cursor = 0;
  }
  current = build(pool[order[cursor++]]);
  preview.textContent = current;
  preview.classList.remove("empty");
  postBtn.disabled = false;
  try {
    await navigator.clipboard.writeText(current);
    copied += 1;
    countEl.textContent = "Copied: " + copied + " comments";
    showToast("Copied");
  } catch (err) {
    showToast("Copy failed. Select the text manually.");
  }
}
generateBtn.addEventListener("click", generate);
postBtn.addEventListener("click", () => {
  if (!current) return;
  window.open("https://x.com/intent/tweet?text=" + encodeURIComponent(current), "_blank", "noopener");
});
document.addEventListener("keydown", event => {
  if (event.code === "Space" && event.target === document.body) {
    event.preventDefault();
    generate();
  }
});
