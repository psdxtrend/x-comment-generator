<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Comment Generator · GO HAIR x Perth</title>
<style>
  :root {
    --bg: #f3f6f1;
    --paper: #fffdfb;
    --ink: #1f2922;
    --muted: #6d776f;
    --line: #dbe4dc;
    --green: #2f6b45;
    --green-dark: #245538;
    --gold: #b7a08a;
    --chip: #eaf1eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 18px 56px; }
  h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
  .sub { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
  .notice {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--chip);
    border-left: 3px solid var(--gold);
    color: #3e4a41;
    font-size: 14px;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin: 22px 0 16px;
    font-size: 15px;
  }
  .count { font-weight: 600; }
  .pool { color: var(--muted); }
  .preview {
    min-height: 220px;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 16px;
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 15px;
  }
  .preview.empty { color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button {
    appearance: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    padding: 6px 10px;
    min-height: 32px;
  }
  .primary { background: var(--green); color: #fff; flex: 0 0 auto; }
  .primary:hover { background: var(--green-dark); }
  .secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
    flex: 0 0 auto;
  }
  .secondary:hover { background: #e7eee8; }
  .secondary:disabled { opacity: 0.45; cursor: not-allowed; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: #fff;
    padding: 10px 14px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>X Comment Generator</h1>
      <p class="sub">English only. Short comments.</p>
      <div class="notice">Press Space to Generate and Copy. Trend start 19:15. Do not use the keyword or hashtag before then.</div>
    </header>
    <div class="stats">
      <div class="count" id="count">Copied: 0 comments</div>
      <div class="pool" id="pool"></div>
    </div>
    <div class="preview empty" id="preview">Your comment will appear here.</div>
    <div class="actions">
      <button class="primary" id="generate" type="button">Generate &amp; Copy</button>
      <button class="secondary" id="post" type="button" disabled>Space</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script>
const openings = [
  "Perth looks at ease beside Go Hair at Tops.",
  "This Perth and Go Hair stop feels soft, not staged.",
  "Go Hair with Perth has a clean rhythm.",
  "Pinklao gives the booth air and Perth uses it well.",
  "The pairing feels like style meeting real care.",
  "Perth keeps the frame personal and easy.",
  "Soft confidence from Perth holds the evening.",
  "The Tops evening feels unhurried and suits Perth.",
  "Go Hair chose a face that does not compete with the result.",
  "Perth beside Go Hair gives the stop a quiet center.",
  "Clean warmth from Perth, no forced shine.",
  "Both names stay in the same temperature.",
  "The booth breathes so the hair detail can be read.",
  "Perth makes Pinklao feel closer.",
  "Soft light, calm face, result that does not shout.",
  "Go Hair looks careful and Perth keeps it warm.",
  "The pace at Tops matches Perth well.",
  "Perth stands still long enough for the finish to land.",
  "Pinklao plus Go Hair has a real setting.",
  "Perth does not force the mood. That is the appeal.",
  "Face and formula share the shot cleanly.",
  "This drop slows just enough to notice.",
  "Tops of Beauty looks clearer with them together.",
  "First the calm, then the shine.",
  "Perth keeps it soft. Go Hair keeps it precise."
];
const middles = [
  "The finish looks soft and easy to believe.",
  "A clean result does the convincing.",
  "Go Hair shows the outcome without covering Perth.",
  "The shine reads as real care.",
  "Nothing looks overworked.",
  "Booth, light and result sit in one glance.",
  "Polished yet still like real hair.",
  "Pinklao gives the detail room to land.",
  "Pace is slow enough to remember.",
  "Both sides stay visible."
];
const closers = [
  "Hoping the next stop keeps this quiet pace.",
  "Interest is already in the tone.",
  "Pinklao should not be the last calm frame.",
  "A continuation would feel earned.",
  "The balance holds the attention.",
  "This tone is worth keeping.",
  "Saving attention for what follows.",
  "The restraint is what lands."
];
const pool = [];
openings.forEach(o => {
  middles.forEach(m => {
    closers.forEach(c => pool.push(o + " " + m + " " + c));
  });
});
let order = pool.map((_, i) => i);
let cursor = 0;
let copied = 0;
let current = "";
const countEl = document.getElementById("count");
const poolEl = document.getElementById("pool");
const preview = document.getElementById("preview");
const postBtn = document.getElementById("post");
const toast = document.getElementById("toast");
poolEl.textContent = "Pool: " + pool.length + " comments";
function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = list[i];
    list[i] = list[j];
    list[j] = tmp;
  }
}
shuffle(order);
function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 1400);
}
function build(body) {
  return body + "\n\nPERTH X TOPS OF GOHAIR\n\n#GOHAIRxPerth\n#PerthTanapon";
}
async function generate() {
  if (cursor >= order.length) {
    shuffle(order);
    cursor = 0;
  }
  current = build(pool[order[cursor++]]);
  preview.textContent = current;
  preview.classList.remove("empty");
  postBtn.disabled = false;
  try {
    await navigator.clipboard.writeText(current);
    copied += 1;
    countEl.textContent = "Copied: " + copied + " comments";
    showToast("Copied");
  } catch (err) {
    showToast("Copy failed. Select the text manually.");
  }
}
document.getElementById("generate").addEventListener("click", generate);
postBtn.addEventListener("click", async () => {
  await generate();
  if (!current) return;
  window.open("https://x.com/intent/tweet?text=" + encodeURIComponent(current), "_blank", "noopener");
});
document.addEventListener("keydown", (event) => {
  if (event.code !== "Space") return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  event.preventDefault();
  generate();
});
</script>
</body>
</html>
