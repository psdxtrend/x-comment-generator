<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Comment Generator</title>
<style>
  :root {
    --bg: #f4f7f4;
    --paper: #fffcfa;
    --ink: #243028;
    --muted: #6d7a72;
    --line: #d7e2da;
    --green: #2f6b4f;
    --green-dark: #24553e;
    --gold: #b7a08a;
    --chip: #e7eee8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 18px 56px; }
  h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
  .sub { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
  .notice {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--chip);
    border-left: 3px solid var(--gold);
    color: #3e4a42;
    font-size: 14px;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin: 22px 0 16px;
    font-size: 15px;
  }
  .count { font-weight: 600; }
  .pool { color: var(--muted); }
  .preview {
    min-height: 220px;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 16px;
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 15px;
  }
  .preview.empty { color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button {
    appearance: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    padding: 6px 10px;
    min-height: 32px;
  }
  .primary { background: var(--green); color: #fff; flex: 0 0 auto; }
  .primary:hover { background: var(--green-dark); }
  .secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
    flex: 0 0 auto;
  }
  .secondary:hover { background: #e7eee8; }
  .secondary:disabled { opacity: 0.45; cursor: not-allowed; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: #fff;
    padding: 10px 14px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>X Comment Generator</h1>
      <p class="sub">English only. Longer comments, written to invite a reply.</p>
      <div class="notice">Press Space to Generate and Copy. Trend start 19:15. Do not use the keyword or hashtag before then.</div>
    </header>
    <div class="stats">
      <div class="count" id="count">Copied: 0 comments</div>
      <div class="pool" id="pool"></div>
    </div>
    <div class="preview empty" id="preview">Your comment will appear here.</div>
    <div class="actions">
      <button class="primary" id="generate" type="button">Generate &amp; Copy</button>
      <button class="secondary" id="post" type="button" disabled>Post X</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script>
const comments = [
  "Perth does not push the booth, and that is what makes this Go Hair stop at Tops feel considered. The Pinklao light stays soft, the finish reads like real hair, and the brand never has to shout to stay in the frame. Curious if the next city keeps this same quiet pace.",
  "What stands out is how easily Perth sits beside Go Hair. It does not feel like a face dropped onto a product, more like the evening was built around that calm. Healthy weight, light shine, nothing forced. Would you rather they stay in this retail mood, or take the collab outside?",
  "Central Pinklao gives the whole thing air. Perth looks at ease, the hair story stays refined, and Go Hair gets a setting with actual character instead of a plain studio. That combination is harder to fake than a glossy close-up. The restraint is doing a lot of the work here.",
  "I keep coming back to the finish. Go Hair shows the result without over-polishing it, and Perth makes that result feel personal instead of staged. Soft shine, clean texture, a formula that looks wearable. That is usually what makes people trust a hair drop more than a hard sell.",
  "Perth and Go Hair share one temperature on screen. Neither one races ahead, which is rare for a booth collab. Tops of Beauty holds the mood together, and the product still reads as the point. Feels like the start of a longer story, not a one-off stop.",
  "There is a clean warmth in how Perth shows up here. No forced smile, no loud styling, just enough presence to give Go Hair a face people can actually place. The shine reads as care, not a filter. That difference matters more than people admit.",
  "The pairing feels measured. Go Hair with Perth makes the evening precise, and Pinklao stops it from looking cold. Clean texture, calm pace, a G floor setting you remember. If they build on this, I hope they keep the unhurried part instead of turning the next stop into a spectacle.",
  "Watching this, the hair story and the Perth story do not compete. They build the same frame. Go Hair earns the look through a gentle formula, and the booth light does the rest. Quiet care is an easy phrase, but this one actually looks like it.",
  "A quiet confidence from Perth keeps the whole thing grounded. Go Hair could have gone brighter and louder, and instead the finish stays close to real hair. That choice is what makes the collab feel closer. Are you reading this more as a hair drop or as an evening story?",
  "Tops of Beauty plus this booth has a specific atmosphere. Light, place, and pace all pull the same way, so the details land instead of getting lost. Perth turns the setup into something less distant. Worth staying with, especially if the next city keeps this tone.",
  "It is rare to see a hair brand and a face align this neatly. Perth does not force the mood, Go Hair does not over-explain the product, and the result still looks believable. The booth breathes. That is usually what makes a comment section stay open longer than a quick like.",
  "The quiet presence is the hook. Perth gives the scene someone to trust, and Go Hair uses that trust instead of covering it with effects. Soft finish, light shine, a texture that feels wearable. Hoping Pinklao is not the last time these names meet.",
  "This reads as style meeting care more than a standard endorsement. Perth beside Go Hair gives the frame a center, and the night mood stays warm without turning loud. I would actually watch a longer cut of this. The stills already feel like they have a second chapter in them.",
  "What Go Hair presents looks careful. The finish is refined, the hair story matches, and Perth keeps it from feeling like a catalog. Pinklao adds air so the care does not get heavy. That balance is the part people will remember after the hashtags scroll past.",
  "If there is a next round, the interest is already there. Perth and Go Hair have room to grow without repeating the same shot. Another city, same temperature, would land. The current stop already feels earned, which is the harder part.",
  "The visual rhythm is slow enough to notice the product. Clean texture, calm tone, no shouting. Perth looks at ease and that ease carries the frame, while Go Hair stays visible instead of hiding behind the face. A continuation in this register would not feel repetitive.",
  "Warm, unhurried, still precise. That is the vibe, and it suits both Perth and Go Hair better than a hard studio light would. The shine reads as care. Do you think the location is doing as much work as the casting here?",
  "Perth makes the evening feel personal. Go Hair makes the result easy to believe. Together they avoid the usual staged booth look, and Tops keeps the light honest. Small choices, but they add up to something people actually stop on.",
  "The collaboration lets both sides stay visible. Perth is not just decoration, and Go Hair is not just a logo in the corner. The finish is polished while still looking like real hair. That is the line most drops miss, and this one stays on the right side of it.",
  "Saving attention for whatever follows this booth. The first chapter already has a clear center: Perth, Go Hair, and a Pinklao frame that does not rush. If they keep the tone and change the city, it should still feel like the same story. Curious what detail you noticed first."
];

let order = comments.map((_, i) => i);
let cursor = 0;
let copied = 0;
let current = "";
const countEl = document.getElementById("count");
const poolEl = document.getElementById("pool");
const preview = document.getElementById("preview");
const postBtn = document.getElementById("post");
const toast = document.getElementById("toast");
poolEl.textContent = "Pool: " + comments.length + " comments";

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = list[i];
    list[i] = list[j];
    list[j] = tmp;
  }
}
shuffle(order);

function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 1400);
}

function build(body) {
  return body + "\n\nPERTH X TOPS OF GOHAIR\n\n#GOHAIRxPerth\n#PerthTanapon";
}

async function generate() {
  if (cursor >= order.length) {
    shuffle(order);
    cursor = 0;
  }
  current = build(comments[order[cursor++]]);
  preview.textContent = current;
  preview.classList.remove("empty");
  postBtn.disabled = false;
  try {
    await navigator.clipboard.writeText(current);
    copied += 1;
    countEl.textContent = "Copied: " + copied + " comments";
    showToast("Copied");
  } catch (err) {
    showToast("Copy failed. Select the text manually.");
  }
}

document.getElementById("generate").addEventListener("click", generate);
postBtn.addEventListener("click", () => {
  if (!current) return;
  window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(current), "_blank", "noopener");
});
document.addEventListener("keydown", (event) => {
  if (event.code !== "Space") return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  event.preventDefault();
  generate();
});
</script>
</body>
</html>
